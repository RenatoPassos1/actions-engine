# LeilôAI — Agregadores SPA scrape via Playwright
#
# Núcleo, Sodré Santoro, Mega Leilões, Portal Zuk, Frazão e Hasta são
# SPA Angular/Next puros — listagem de lotes só aparece após JS rodar.
# Cloudflare Worker fetch comum não vê os cards. Resolução: Playwright
# headless via GitHub Actions (repo público = minutos ilimitados).
#
# Cada agregador tem seu seletor próprio mapeado em SCRAPERS.
# POSTa em chunks de 100 para o worker leiloai-w05
# /ingest com source_id correto.
#
# Cron: a cada 6h (4x/dia). Manual via workflow_dispatch.

name: "LeilôAI: Agregadores Playwright"

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Lista de sources (separadas por espaço) ou 'all'"
        required: false
        default: "all"
        type: string

concurrency:
  group: leiloai-agregadores-pw
  cancel-in-progress: false

env:
  AGREGADORES_URL: ${{ secrets.LEILOAI_AGREGADORES_URL || 'https://leiloai-w05.conta-removida-da-historia.invalid' }}

jobs:
  scrape:
    name: Playwright agregadores
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install Playwright + chromium
        run: |
          mkdir -p /tmp/agg && cd /tmp/agg
          npm init -y >/dev/null
          npm install playwright@1
          npx playwright install chromium --with-deps

      - name: Scrape agregadores SPA
        working-directory: /tmp/agg
        env:
          DISPARO: ${{ secrets.LEILOAI_DISPARO_SECRET }}
          SOURCES: ${{ github.event.inputs.sources || 'all' }}
        run: |
          cat > /tmp/agg/scrape.mjs <<'EOF'
          import { chromium } from "playwright";

          const AGG = process.env.AGREGADORES_URL;
          const DISPARO = process.env.DISPARO;
          const FILTRO = (process.env.SOURCES ?? "all").split(/\s+/).filter(Boolean);
          if (!DISPARO) throw new Error("LEILOAI_DISPARO_SECRET ausente");

          // Cada scraper define como navegar e extrair cards do site.
          // Strategy: abre URL, espera networkidle + selector, intercepta
          // responses JSON internas, extrai DOM, combina e POSTa.
          const SCRAPERS = [
            {
              source_id: "agg-nucleo",
              name: "Núcleo Leilões",
              url: "https://www.nucleoleiloes.com.br/imoveis",
              waitSelector: "a[href*='/imovel/'], .card, [data-imovel-id]",
              extract: extractNucleo,
            },
            {
              source_id: "agg-sodre",
              name: "Sodré Santoro",
              url: "https://www.sodresantoro.com.br/leiloes",
              waitSelector: "a[href*='/leilao/'], .card-leilao, .item-leilao",
              extract: extractSodre,
            },
            {
              source_id: "agg-mega",
              name: "Mega Leilões",
              url: "https://www.megaleiloes.com.br/imoveis",
              waitSelector: "a[href*='/imoveis/'], .card-lote, .lote-item",
              extract: extractMega,
            },
            {
              source_id: "agg-zuk",
              name: "Portal Zuk",
              url: "https://www.portalzuk.com.br/imoveis-em-leilao",
              waitSelector: "a[href*='/imovel'], .card-imovel, .property-card",
              extract: extractZuk,
            },
            {
              source_id: "agg-frazao",
              name: "Frazão Leilões",
              url: "https://www.frazaoleiloes.com.br/imoveis",
              waitSelector: "a[href*='/lote/'], .card-lote, .item-lote",
              extract: extractFrazao,
            },
            {
              source_id: "agg-hasta",
              name: "Hasta Leilões",
              url: "https://www.hastaleiloes.com.br/imoveis",
              waitSelector: "a[href*='/lote/'], .card-lote",
              extract: extractGenerico,
            },
            {
              source_id: "agg-biasi",
              name: "Biasi Leilões",
              url: "https://www.biasileiloes.com.br/imoveis",
              waitSelector: "a[href*='/lote/'], .card-lote, .item-lote",
              extract: extractGenerico,
            },
          ];

          const ativos = SCRAPERS.filter((s) =>
            FILTRO[0] === "all" || FILTRO.includes(s.source_id) || FILTRO.includes(s.source_id.replace("agg-", "")),
          );

          const browser = await chromium.launch({ headless: true });
          const ctx = await browser.newContext({
            userAgent:
              "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36 LeiloAI-Crawler/1.0",
            locale: "pt-BR",
            viewport: { width: 1366, height: 900 },
          });

          const resumoFinal = [];
          for (const sc of ativos) {
            console.log(`\n=== ${sc.source_id} ===`);
            const page = await ctx.newPage();
            const responsesAPI = [];
            page.on("response", async (resp) => {
              const url = resp.url();
              const ct = resp.headers()["content-type"] ?? "";
              if (!ct.includes("json")) return;
              if (!/imov|leilo|lote|search|busca|propert/i.test(url)) return;
              try {
                const body = await resp.json();
                responsesAPI.push({ url, body });
              } catch {}
            });

            try {
              console.log(`Navegando para ${sc.url}…`);
              await page.goto(sc.url, { waitUntil: "networkidle", timeout: 45_000 });
              try {
                await page.waitForSelector(sc.waitSelector, { timeout: 20_000 });
              } catch {
                console.warn(`Selector "${sc.waitSelector}" não apareceu, extraindo mesmo assim`);
              }
              for (let i = 0; i < 6; i++) {
                await page.evaluate(() => window.scrollTo(0, document.body.scrollHeight));
                await page.waitForTimeout(700);
              }
              const items = await sc.extract(page, responsesAPI);
              console.log(`${sc.source_id}: ${items.length} items extraídos`);

              if (items.length) {
                const CHUNK = 100;
                let inseridos = 0;
                for (let i = 0; i < items.length; i += CHUNK) {
                  const slice = items.slice(i, i + CHUNK);
                  const resp = await fetch(`${AGG}/ingest`, {
                    method: "POST",
                    headers: {
                      "x-disparo-secret": DISPARO,
                      "content-type": "application/json",
                    },
                    body: JSON.stringify({ source_id: sc.source_id, items: slice }),
                  });
                  const txt = await resp.text();
                  if (resp.ok) {
                    try { inseridos += JSON.parse(txt).inseridos ?? 0; } catch {}
                  } else {
                    console.warn(`POST chunk ${i}: HTTP ${resp.status} ${txt.slice(0, 200)}`);
                  }
                }
                console.log(`${sc.source_id}: ${inseridos} inseridos`);
                resumoFinal.push({ source_id: sc.source_id, items: items.length, inseridos });
              } else {
                resumoFinal.push({ source_id: sc.source_id, items: 0, inseridos: 0 });
              }
            } catch (err) {
              console.error(`${sc.source_id} falhou:`, err.message);
              resumoFinal.push({ source_id: sc.source_id, erro: err.message });
            } finally {
              await page.close();
            }
          }

          await browser.close();
          console.log("\n=== RESUMO ===");
          console.log(JSON.stringify(resumoFinal, null, 2));

          // ---- extractors ----
          async function extractNucleo(page, responsesAPI) {
            // Tenta API interna primeiro
            for (const { body } of responsesAPI) {
              const lista = body?.imoveis ?? body?.data ?? body?.results ?? body?.items ?? body;
              if (Array.isArray(lista) && lista.length && lista[0]?.id) {
                return lista.slice(0, 200).map((r) => normalizar(r, "nucleoleiloes.com.br"));
              }
            }
            return await page.$$eval("a[href*='/imovel/'], a[href*='/lote/'], .card", (els) =>
              els.slice(0, 100).map((el) => extrairCardDOM(el)).filter(Boolean),
            );
          }
          async function extractSodre(page, responsesAPI) {
            for (const { body } of responsesAPI) {
              const lista = body?.lotes ?? body?.data ?? body?.items ?? body;
              if (Array.isArray(lista) && lista.length) return lista.slice(0, 200).map((r) => normalizar(r, "sodresantoro.com.br"));
            }
            return await page.$$eval(
              "a[href*='/leilao/'], a[href*='/lote/'], .card-leilao, .item-leilao",
              (els) => els.slice(0, 100).map((el) => extrairCardDOM(el)).filter(Boolean),
            );
          }
          async function extractMega(page, responsesAPI) {
            for (const { body } of responsesAPI) {
              const lista = body?.lotes ?? body?.imoveis ?? body?.data ?? body?.items ?? body;
              if (Array.isArray(lista) && lista.length) return lista.slice(0, 200).map((r) => normalizar(r, "megaleiloes.com.br"));
            }
            return await page.$$eval(
              "a[href*='/imoveis/'], a[href*='/lote/'], .card-lote, .lote-item",
              (els) => els.slice(0, 100).map((el) => extrairCardDOM(el)).filter(Boolean),
            );
          }
          async function extractZuk(page, responsesAPI) {
            for (const { body } of responsesAPI) {
              const lista = body?.imoveis ?? body?.properties ?? body?.data ?? body?.items ?? body;
              if (Array.isArray(lista) && lista.length) return lista.slice(0, 200).map((r) => normalizar(r, "portalzuk.com.br"));
            }
            return await page.$$eval(
              "a[href*='/imovel'], a[href*='/lote'], .property-card, .card-imovel",
              (els) => els.slice(0, 100).map((el) => extrairCardDOM(el)).filter(Boolean),
            );
          }
          async function extractFrazao(page, responsesAPI) {
            for (const { body } of responsesAPI) {
              const lista = body?.lotes ?? body?.data ?? body?.items ?? body;
              if (Array.isArray(lista) && lista.length) return lista.slice(0, 200).map((r) => normalizar(r, "frazaoleiloes.com.br"));
            }
            return await page.$$eval(
              "a[href*='/lote/'], a[href*='/leilao/'], .card-lote, .item-lote",
              (els) => els.slice(0, 100).map((el) => extrairCardDOM(el)).filter(Boolean),
            );
          }
          async function extractGenerico(page) {
            return await page.$$eval(
              "a[href*='/lote/'], a[href*='/imovel/'], .card-lote, .card-imovel, .item-lote, [data-id]",
              (els) => els.slice(0, 100).map((el) => extrairCardDOM(el)).filter(Boolean),
            );
          }

          function normalizar(r, host) {
            const id = String(r.id ?? r.idImovel ?? r.codigo ?? r.numero ?? r.slug ?? "");
            if (!id) return null;
            const url = String(r.url ?? r.permalink ?? r.link ?? `/imovel/${id}`);
            return {
              id,
              titulo: r.titulo ?? r.nome ?? r.title ?? r.descricao ?? "Lote",
              descricao: r.descricao ?? r.description ?? null,
              uf: r.uf ?? r.estado ?? r.state ?? null,
              cidade: r.cidade ?? r.municipio ?? r.city ?? null,
              bairro: r.bairro ?? r.neighborhood ?? null,
              endereco: r.endereco ?? r.address ?? null,
              area: r.area ?? r.areaTotal ?? r.areaUtil ?? null,
              lance_minimo: r.lanceMinimo ?? r.valorMinimo ?? r.preco ?? r.valor ?? r.lance ?? null,
              avaliacao: r.avaliacao ?? r.valorAvaliacao ?? null,
              edital_pdf_url: r.editalUrl ?? r.urlEdital ?? null,
              url: url.startsWith("http") ? url : `https://www.${host}${url.startsWith("/") ? url : `/${url}`}`,
              raw_payload: { fonte_api: host },
            };
          }
          EOF

          # Helper extrairCardDOM injetado em todas as page.$$eval via context init
          cat >> /tmp/agg/scrape.mjs <<'EOF2'

          // Injeta helper extrairCardDOM no browser context
          // (Playwright limitation: function refs nao cruzam o boundary,
          // mas como sao $$eval inline, replico a logica em cada extrator).
          EOF2

          # patch: remover o JS file da chamada extrairCardDOM com inline JS direto
          # (mais simples: gerar versao com helper definido em cada $$eval)
          # ATENCAO: este e o `cat >` que vale. Os dois blocos acima sao
          # sobrescritos por ele (`>` trunca) e nunca chegam a rodar.
          cat > /tmp/agg/scrape.mjs <<'EOF'
          import { chromium } from "playwright";

          // Helper injetado em toda pagina (ctx.addInitScript). O $$eval nao
          // enxerga o escopo do Node, entao a extracao de foto/praca/veiculo
          // vive aqui e e chamada como window.__lai.extras(...).
          // String.raw: template literal comum comeria os \d, \s das regex.
          const HELPERS_BROWSER = String.raw`
          window.__lai = (function () {
            // Rejeita o que nao e foto do bem. Medido em 04/08/2026 no megaleiloes:
            // placeholder card-no-image-320x240.png, icone auction-gavet.png (background
            // do link "adicionar ao auditorio") e logo do banco em /bank_icons/. No
            // sodresantoro: banner de campanha em /banners/ (foto real em /photos/).
            var RUIM = /favicon|placeholder|sem[-_]?(foto|imagem)|no[-_]?image|nophoto|spinner|loading|blank\.|1x1|pixel|gavet|sprite|whats|facebook|instagram|youtube/i;
            var CAMINHO_RUIM = /\/(bank_icons?|icons?|sprites?|logos?|banners?|flags?|avatars?|selos?|badges?|bandeiras?)\//i;
            var EXT = /\.(jpe?g|png|webp|avif)(?:[?#]|$)/i;
            var MIDIA = /\/(batches?|lotes?|bens?|imagens?|images?|fotos?|photos?|thumbs?|media|uploads?|arquivos?|storage|cdn)\//i;
            var ATTRS = ["data-bg","data-background","data-background-image","data-src","data-original",
                         "data-lazy","data-lazy-src","data-echo","data-image","src","data-srcset","srcset"];

            function limpar(bruto, base) {
              if (!bruto) return null;
              // srcset vem "url 320w, url 640w": fica com a primeira URL
              var u = String(bruto).trim().split(",")[0].trim().split(/\s+/)[0];
              if (!u || /^(data|blob|javascript|about):/i.test(u)) return null;
              var abs;
              try { abs = new URL(u, base).toString(); } catch (e) { return null; }
              if (RUIM.test(abs) || CAMINHO_RUIM.test(abs)) return null;
              if (!EXT.test(abs) && !MIDIA.test(abs)) return null;
              return abs;
            }

            function daCss(valor, base) {
              if (!valor || valor === "none") return null;
              var m = String(valor).match(/url\(\s*["']?(.*?)["']?\s*\)/i);
              return m ? limpar(m[1], base) : null;
            }

            // A foto do card raramente e <img src>: muitos agregadores usam
            // background-image (inline ou via lazyload em data-bg). Cobre os dois.
            function imagens(raiz, base, max) {
              var lim = max || 4;
              var out = [];
              function add(u) { if (u && out.indexOf(u) === -1 && out.length < lim) out.push(u); }
              if (!raiz || raiz.nodeType !== 1) return out;
              var alvos = [];
              try {
                alvos = Array.prototype.slice.call(raiz.querySelectorAll(
                  "img, source, [data-bg], [data-background], [data-background-image], [data-src]," +
                  "[class*='image'], [class*='imagem'], [class*='foto'], [class*='photo']," +
                  "[class*='thumb'], [class*='picture'], figure, picture"
                ));
              } catch (e) {}
              try { if (raiz.matches("img,[data-bg],[data-src],[class*='image'],[class*='foto'],[class*='photo'],[class*='thumb']")) alvos.unshift(raiz); } catch (e) {}
              for (var i = 0; i < alvos.length && out.length < lim; i++) {
                var el = alvos[i];
                for (var a = 0; a < ATTRS.length; a++) add(limpar(el.getAttribute(ATTRS[a]), base));
                if (el.currentSrc) add(limpar(el.currentSrc, base));
                var st = el.getAttribute("style");
                if (st && st.indexOf("background") !== -1) add(daCss(st, base));
                if (!out.length) { try { add(daCss(getComputedStyle(el).backgroundImage, base)); } catch (e) {} }
              }
              if (!out.length) {
                var bgs = raiz.querySelectorAll("[style*='background']");
                for (var j = 0; j < bgs.length && !out.length; j++) add(daCss(bgs[j].getAttribute("style"), base));
              }
              return out;
            }

            // Do link para fora, parando no primeiro ancestral que tem foto. Sem isso
            // o sodresantoro devolvia a foto do lote vizinho: o closest(".card, li")
            // dele cai num container que embrulha varios lotes.
            function imagensPerto(link, bloco, base, max) {
              var nos = [];
              var no = link && link.nodeType === 1 ? link : bloco;
              for (var n = 0; n < 8 && no; n++) {
                nos.push(no);
                if (no === bloco) break;
                no = no.parentElement;
              }
              if (bloco && nos.indexOf(bloco) === -1) nos.push(bloco);
              for (var i = 0; i < nos.length; i++) {
                var r = imagens(nos[i], base, max);
                if (r.length) return r;
              }
              return [];
            }

            function txt(el) { return el && el.textContent ? el.textContent.replace(/\s+/g, " ").trim() : ""; }

            // "R$ 28.509,60" -> 28509.6. Precisa sair do scraper ja numerico: o
            // numOuNull do worker faz replace(",", ".") sem tirar o separador de
            // milhar, entao "10.000,00" vira "10.000.00" -> NaN -> null.
            function preco(t) {
              if (t === null || t === undefined) return null;
              if (typeof t === "number") return isFinite(t) && t > 0 ? t : null;
              var m = String(t).replace(/\s+/g, " ").match(/(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+,\d{1,2}|\d+(?:\.\d{1,2})?)/);
              if (!m) return null;
              var b = m[1], n;
              if (/,\d{1,2}$/.test(b)) n = Number(b.replace(/\./g, "").replace(",", "."));
              else if (/\.\d{3}/.test(b)) n = Number(b.replace(/\./g, ""));
              else n = Number(b);
              return isFinite(n) && n > 0 ? n : null;
            }

            var RE_DATA = /(\d{2})\/(\d{2})\/(\d{4})(?:\s*(?:às|as|-|,)?\s*(\d{1,2})[:h](\d{2}))?/;
            // dd/mm/aaaa [as hh:mm] -> ISO no fuso do Brasil. Sem hora, meio-dia,
            // para nao virar o dia ao converter para UTC.
            function iso(texto) {
              if (!texto) return null;
              var m = String(texto).match(RE_DATA);
              if (!m) return null;
              var ano = Number(m[3]);
              if (ano < 2000 || ano > 2100) return null;
              var h = m[4] ? ("0" + m[4]).slice(-2) : "12";
              return m[3] + "-" + m[2] + "-" + m[1] + "T" + h + ":" + (m[5] || "00") + ":00-03:00";
            }

            // 1a/2a praca. Seletores medidos no megaleiloes
            // (.card-first-instance-date / .card-second-instance-date, valor no
            // .card-instance-value irmao); fallback por rotulo no texto do card serve
            // o resto dos agregadores.
            function pracas(raiz) {
              var r = { primeira: null, segunda: null, lance_segunda: null };
              if (!raiz || raiz.nodeType !== 1) return r;
              var e1 = raiz.querySelector("[class*='first-instance-date'], .primeira-praca, .data-primeira-praca");
              var e2 = raiz.querySelector("[class*='second-instance-date'], .segunda-praca, .data-segunda-praca");
              r.primeira = iso(txt(e1));
              r.segunda = iso(txt(e2));
              if (e2 && e2.parentElement) {
                var v = e2.parentElement.querySelector("[class*='instance-value'], .valor, .value, .preco");
                if (v) r.lance_segunda = preco(txt(v));
              }
              var t = txt(raiz);
              if (!r.primeira) {
                var m1 = t.match(/(?:1[ª°a]?\s*pra[çc]a|primeira\s+pra[çc]a|1[ª°a]?\s*leil[ãa]o|data\s*(?:do\s*)?leil[ãa]o|abertura)\s*:?\s*([^|]{0,32})/i);
                r.primeira = iso(m1 && m1[1]);
              }
              if (!r.segunda) {
                var m2 = t.match(/(?:2[ª°a]?\s*pra[çc]a|segunda\s+pra[çc]a|2[ª°a]?\s*leil[ãa]o)\s*:?\s*([^|]{0,32})/i);
                r.segunda = iso(m2 && m2[1]);
              }
              return r;
            }

            // Ano/marca/modelo so quando o item e mesmo veiculo. O card do megaleiloes
            // nao tem campo estruturado: o dado esta no titulo
            // ("Carro Hyundai Tucson GLSB - 2011/2012"). Sem marca reconhecida, null.
            var MARCAS = ["Chevrolet","Volkswagen","Fiat","Ford","Toyota","Honda","Hyundai","Renault",
              "Nissan","Peugeot","Citroën","Citroen","Jeep","Mitsubishi","Kia","Chery","Caoa","Suzuki",
              "Subaru","BMW","Mercedes-Benz","Mercedes","Audi","Volvo","Land Rover","Jaguar","Porsche",
              "Iveco","Scania","Agrale","Troller","JAC","Effa","Lifan","RAM","Dodge","Chrysler","Yamaha",
              "Kawasaki","Harley-Davidson","Ducati","Triumph","Shineray","Dafra","Sundown","Traxx","Haojue",
              "Royal Enfield","BYD","GWM","Foton","Marcopolo","Randon","New Holland","Massey Ferguson",
              "Valtra","John Deere","Komatsu","Caterpillar","Yanmar","Hafei","Sinotruk","Mini","VW","GM"];
            var RE_VEIC = /ve[í i]cul|carro|autom[oó]vel|motocicl|moto\b|caminh[aã]o|caminhon|[oô]nibus|reboque|trator|sucata|van\b|utilit[aá]ri|semirreboque|quadricicl|lancha|embarca/i;

            function veiculo(titulo, url) {
              var out = { year: null, brand: null, model: null };
              var t = String(titulo || "");
              var u = String(url || "");
              if (!RE_VEIC.test(t) && !/\/(veiculos?|carros?|motos?|caminhoes|caminh[oõ]es|sucatas?)\//i.test(u)) return out;
              // "2011/2012" = fabricacao/modelo: vale o ano modelo (o segundo)
              var par = t.match(/\b(19[5-9]\d|20[0-4]\d)\s*[\/\-]\s*(19[5-9]\d|20[0-4]\d)\b/);
              if (par) out.year = Number(par[2]);
              if (!out.year) {
                var so = t.match(/(?:^|[\s\-,(])(19[5-9]\d|20[0-4]\d)(?:$|[\s\-,)])/);
                if (so) out.year = Number(so[1]);
              }
              var alvo = t.replace(/ë/g, "e");
              for (var i = 0; i < MARCAS.length; i++) {
                var marca = MARCAS[i];
                var re = new RegExp("(?:^|[\\s\\/,.\\-(])" + marca.replace(/[-\/\\^$*+?.()|[\]{}]/g, "\\$&").replace(/ë/g, "e") + "(?=$|[\\s\\/,.\\-)])", "i");
                var m = alvo.match(re);
                if (!m) continue;
                out.brand = marca;
                var resto = alvo.slice(m.index + m[0].length);
                var modelo = resto.split(/\s+[\-–]\s+|,|\||\d{4}\s*\//)[0].replace(/^[\s\/\-,.]+/, "").trim();
                out.model = modelo ? modelo.slice(0, 60) : null;
                break;
              }
              return out;
            }

            // Junta os campos novos num objeto pronto para o /ingest do worker.
            // O parametro link (opcional) e a ancora do lote: com ela a foto sai do
            // container mais justo, sem pegar a do vizinho.
            function extras(raiz, base, titulo, url, link) {
              var imgs = imagensPerto(link, raiz, base, 4);
              var p = pracas(raiz);
              var v = veiculo(titulo, url);
              return {
                images: imgs.length ? imgs : null,
                first_auction_at: p.primeira,
                second_auction_at: p.segunda,
                second_bid: p.lance_segunda,
                year: v.year,
                brand: v.brand,
                model: v.model,
              };
            }

            return { imagens: imagens, imagensPerto: imagensPerto, pracas: pracas, veiculo: veiculo, extras: extras, iso: iso, preco: preco };
          })();
          `;

          const AGG = process.env.AGREGADORES_URL;
          const DISPARO = process.env.DISPARO;
          const FILTRO = (process.env.SOURCES ?? "all").split(/\s+/).filter(Boolean);
          if (!DISPARO) throw new Error("LEILOAI_DISPARO_SECRET ausente");

          const SCRAPERS = [
            { source_id: "agg-nucleo", url: "https://www.nucleoleiloes.com.br/imoveis", host: "nucleoleiloes.com.br", waitSelector: "a[href*='/imovel/'], .card" },
            { source_id: "agg-sodre", url: "https://www.sodresantoro.com.br/leiloes", host: "sodresantoro.com.br", waitSelector: "a[href*='/leilao/'], .card-leilao, .item-leilao" },
            { source_id: "agg-mega", url: "https://www.megaleiloes.com.br/imoveis", host: "megaleiloes.com.br", waitSelector: "a[href*='/imoveis/'], .card-lote, .lote-item" },
            { source_id: "agg-zuk", url: "https://www.portalzuk.com.br/imoveis-em-leilao", host: "portalzuk.com.br", waitSelector: "a[href*='/imovel'], .card-imovel, .property-card" },
            { source_id: "agg-frazao", url: "https://www.frazaoleiloes.com.br/imoveis", host: "frazaoleiloes.com.br", waitSelector: "a[href*='/lote/'], .card-lote" },
            { source_id: "agg-hasta", url: "https://www.hastaleiloes.com.br/imoveis", host: "hastaleiloes.com.br", waitSelector: "a[href*='/lote/'], .card-lote" },
            { source_id: "agg-biasi", url: "https://www.biasileiloes.com.br/imoveis", host: "biasileiloes.com.br", waitSelector: "a[href*='/lote/'], .card-lote" },
          ];

          const ativos = SCRAPERS.filter((s) =>
            FILTRO[0] === "all" || FILTRO.includes(s.source_id) || FILTRO.includes(s.source_id.replace("agg-", "")),
          );

          const browser = await chromium.launch({ headless: true });
          const ctx = await browser.newContext({
            userAgent:
              "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36 LeiloAI-Crawler/1.0",
            locale: "pt-BR",
            viewport: { width: 1366, height: 900 },
          });
          await ctx.addInitScript({ content: HELPERS_BROWSER });

          const resumoFinal = [];
          for (const sc of ativos) {
            console.log(`\n=== ${sc.source_id} ===`);
            const page = await ctx.newPage();
            const responsesAPI = [];
            page.on("response", async (resp) => {
              const url = resp.url();
              const ct = resp.headers()["content-type"] ?? "";
              if (!ct.includes("json")) return;
              if (!/imov|leilo|lote|search|busca|propert|catalog/i.test(url)) return;
              try {
                const body = await resp.json();
                responsesAPI.push({ url, body });
              } catch {}
            });

            try {
              console.log(`Navegando para ${sc.url}…`);
              await page.goto(sc.url, { waitUntil: "networkidle", timeout: 45_000 });
              try {
                await page.waitForSelector(sc.waitSelector, { timeout: 20_000 });
              } catch {
                console.warn(`Selector "${sc.waitSelector}" não apareceu, extraindo mesmo assim`);
              }
              // Scroll gradual, nao um pulo para o rodape: o lazyload so carrega
              // a foto do card que passa pela viewport. Medido no sodresantoro:
              // pulando para o fim, 0 fotos; passando aos poucos, 96.
              for (let i = 1; i <= 6; i++) {
                await page.evaluate((n) => window.scrollTo(0, (document.body.scrollHeight / 6) * n), i);
                await page.waitForTimeout(700);
              }

              // Tenta extrair via API interceptada
              let items = [];
              for (const { body } of responsesAPI) {
                const lista = body?.lotes ?? body?.imoveis ?? body?.properties ?? body?.results ?? body?.data ?? body?.items ?? (Array.isArray(body) ? body : null);
                if (Array.isArray(lista) && lista.length && (lista[0]?.id ?? lista[0]?.codigo ?? lista[0]?.slug)) {
                  items = lista.slice(0, 200).map((r) => normalizarAPI(r, sc.host)).filter(Boolean);
                  if (items.length) break;
                }
              }

              // Fallback DOM
              if (!items.length) {
                items = await page.$$eval(sc.waitSelector, (els, host) => {
                  function extrairCardDOM(el, host) {
                    const link = el.tagName === "A" ? el : el.querySelector("a[href]");
                    const href = link?.getAttribute("href");
                    if (!href) return null;
                    const idMatch = href.match(/\/(\d+)\/?$|[?&]id=(\d+)|\/(?:imovel|lote|leilao)\/(\d+)|\/([a-z0-9-]+)\/?$/);
                    const id = idMatch?.[1] ?? idMatch?.[2] ?? idMatch?.[3] ?? idMatch?.[4] ?? href.replace(/\W+/g, "-").slice(-32);
                    // O <a> sozinho quase nunca contem a foto nem a data da praca:
                    // esses ficam no card em volta. Sobe para o card antes de extrair.
                    const bloco = (el.closest && el.closest("article, .card, .card-imovel, .card-lote, li, .item")) || el.parentElement || el;
                    const titulo = bloco.querySelector("h1,h2,h3,h4,.titulo,.nome,.title,[class*='card-title'],[class*='lote-titulo']")?.textContent?.trim() ?? "Lote";
                    const cidade = bloco.querySelector(".cidade,.municipio,.local,.city,[class*='locality']")?.textContent?.trim() ?? null;
                    const uf = bloco.querySelector(".uf,.estado")?.textContent?.trim()?.slice(0, 2) ?? null;
                    const valor = bloco.querySelector(".valor,.preco,.lance,.lance-minimo,.price,[class*=price],[class*=lance]")?.textContent?.trim() ?? null;
                    const url = href.startsWith("http") ? href : `https://www.${host}${href.startsWith("/") ? href : `/${href}`}`;
                    // foto (background-image/data-bg/img), 1a e 2a praca, segundo
                    // lance e ano/marca/modelo
                    const extras = window.__lai ? window.__lai.extras(bloco, location.href, titulo, url, link) : {};
                    return {
                      id, titulo, cidade, uf,
                      // numero, nao texto: numOuNull do worker devolve NaN->null
                      // para "R$ 28.509,60" (nao remove o separador de milhar)
                      lance_minimo: window.__lai ? window.__lai.preco(valor) : valor,
                      url,
                      ...extras,
                    };
                  }
                  return els.slice(0, 100).map((el) => extrairCardDOM(el, host)).filter(Boolean);
                }, sc.host);
              }

              console.log(`${sc.source_id}: ${items.length} items extraídos`);

              if (items.length) {
                const CHUNK = 100;
                let inseridos = 0;
                for (let i = 0; i < items.length; i += CHUNK) {
                  const slice = items.slice(i, i + CHUNK);
                  const resp = await fetch(`${AGG}/ingest`, {
                    method: "POST",
                    headers: { "x-disparo-secret": DISPARO, "content-type": "application/json" },
                    body: JSON.stringify({ source_id: sc.source_id, items: slice }),
                  });
                  const txt = await resp.text();
                  if (resp.ok) {
                    try { inseridos += JSON.parse(txt).inseridos ?? 0; } catch {}
                  } else {
                    console.warn(`POST chunk ${i}: HTTP ${resp.status} ${txt.slice(0, 200)}`);
                  }
                }
                console.log(`${sc.source_id}: ${inseridos} inseridos`);
                resumoFinal.push({ source_id: sc.source_id, items: items.length, inseridos });
              } else {
                resumoFinal.push({ source_id: sc.source_id, items: 0, inseridos: 0 });
              }
            } catch (err) {
              console.error(`${sc.source_id} falhou:`, err.message);
              resumoFinal.push({ source_id: sc.source_id, erro: err.message });
            } finally {
              await page.close();
            }
          }

          await browser.close();
          console.log("\n=== RESUMO ===");
          console.log(JSON.stringify(resumoFinal, null, 2));

          function normalizarAPI(r, host) {
            const id = String(r.id ?? r.idImovel ?? r.codigo ?? r.numero ?? r.slug ?? "");
            if (!id) return null;
            const url = String(r.url ?? r.permalink ?? r.link ?? `/imovel/${id}`);
            return {
              id,
              titulo: r.titulo ?? r.nome ?? r.title ?? r.descricao ?? "Lote",
              descricao: r.descricao ?? r.description ?? null,
              uf: r.uf ?? r.estado ?? r.state ?? null,
              cidade: r.cidade ?? r.municipio ?? r.city ?? null,
              bairro: r.bairro ?? r.neighborhood ?? null,
              endereco: r.endereco ?? r.address ?? null,
              area: r.area ?? r.areaTotal ?? r.areaUtil ?? null,
              lance_minimo: r.lanceMinimo ?? r.valorMinimo ?? r.preco ?? r.valor ?? r.lance ?? null,
              avaliacao: r.avaliacao ?? r.valorAvaliacao ?? null,
              edital_pdf_url: r.editalUrl ?? r.urlEdital ?? null,
              // API interna tambem publica foto e praca: repassa em vez de descartar
              images: imagensDaAPI(r, `https://www.${host}`),
              first_auction_at: r.primeiraPraca ?? r.dataPrimeiraPraca ?? r.dataLeilao ?? r.data_leilao ?? r.startDate ?? null,
              second_auction_at: r.segundaPraca ?? r.dataSegundaPraca ?? r.data_segunda_praca ?? null,
              second_bid: r.lanceSegunda ?? r.valorSegundaPraca ?? r.segundoLance ?? null,
              year: r.ano ?? r.anoModelo ?? r.year ?? null,
              brand: r.marca ?? r.brand ?? null,
              model: r.modelo ?? r.model ?? null,
              url: url.startsWith("http") ? url : `https://www.${host}${url.startsWith("/") ? url : `/${url}`}`,
              raw_payload: { fonte_api: host },
            };
          }
          /** Achata os varios formatos de foto que as APIs internas usam. */
          function imagensDaAPI(r, base) {
            const bruto = r.images ?? r.imagens ?? r.fotos ?? r.photos ?? r.foto ?? r.imagem ?? r.thumbnail ?? r.thumb ?? null;
            if (!bruto) return null;
            const lista = (Array.isArray(bruto) ? bruto : [bruto])
              .map((x) => (typeof x === "string" ? x : x?.url ?? x?.src ?? x?.link ?? x?.path ?? null))
              .filter((x) => typeof x === "string" && x && !/^data:/i.test(x) && !/no-?image|placeholder|sem-?foto/i.test(x))
              .map((x) => { try { return new URL(x, base).toString(); } catch { return null; } })
              .filter(Boolean)
              .slice(0, 6);
            return lista.length ? lista : null;
          }
          EOF
          cd /tmp/agg && node --experimental-vm-modules scrape.mjs

      - name: Summary
        if: always()
        run: |
          echo "### LeilôAI — Agregadores Playwright" >> $GITHUB_STEP_SUMMARY
          echo "- Data: $(TZ='America/Sao_Paulo' date '+%d/%m/%Y %H:%M BRT')" >> $GITHUB_STEP_SUMMARY
          echo "- Worker: \`${AGREGADORES_URL}\`" >> $GITHUB_STEP_SUMMARY
