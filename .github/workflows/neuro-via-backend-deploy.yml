# Neuro Via Backend — Deploy to Hugging Face Spaces
# Clona repo privado e faz push para HF Spaces (Docker build acontece lá)
# Trigger: repository_dispatch ou manual

name: "Neuro Via: Backend Deploy (HF Spaces)"

on:
  repository_dispatch:
    types: [neuro-via-backend-deploy]
  workflow_dispatch:

concurrency:
  group: neuro-via-backend-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to HF Spaces
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout private repo
        uses: actions/checkout@v6
        with:
          repository: RenatoPassos1/neuro-via
          token: ${{ secrets.REPO_PAT }}
          ref: main
          fetch-depth: 0

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # O token NAO entra na URL. Ate 21/08/2026 esta linha interpolava
          # ${HF_TOKEN} dentro do endereco do remoto, e isso o punha em duas
          # superficies de uma vez: no `ps` do runner enquanto o comando roda,
          # e gravado em texto claro no `.git/config` da arvore de trabalho.
          # O helper abaixo entrega usuario e senha pelo pipe que o git abre,
          # lendo da propria env, entao o valor nunca vira argumento nem
          # arquivo.
          git remote add hf https://huggingface.co/spaces/renatopassos/neuro-via
          git -c credential.helper='!f() { echo username=renatopassos; echo "password=$HF_TOKEN"; }; f' push hf main --force
          echo "Pushed to HF Spaces successfully"

      - name: Deploy summary
        if: success()
        run: |
          echo "### Backend Deploy concluido!" >> $GITHUB_STEP_SUMMARY
          echo "- **Data:** $(TZ='America/Sao_Paulo' date +'%d/%m/%Y %H:%M BRT')" >> $GITHUB_STEP_SUMMARY
          echo "- **HF Space:** https://huggingface.co/spaces/renatopassos/neuro-via" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** $(git log --oneline -1)" >> $GITHUB_STEP_SUMMARY
