# TEMPORARIO. Mede o alcance do LEILOAI_REPO_PAT sem imprimir o valor dele.
#
# POR QUE: a API do GitHub nao expoe o escopo de um PAT, e a secao 40.2 do
# plano de migracao proibe INFERIR permissao pelo nome do secret. Sem medir,
# trocar `REPO_PAT` por `LEILOAI_REPO_PAT` no `leiloai-deploy-watcher` seria
# apostar: aquele workflow tambem ESCREVE neste repositorio (repository_dispatch)
# e nao so le o privado.
#
# Nada aqui altera estado. So HTTP status.
name: "LeilôAI: sonda de escopo do PAT (temporario)"

on:
  workflow_dispatch:

permissions: {}

jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Alcance do PAT dedicado
        env:
          GH_TOKEN: ${{ secrets.LEILOAI_REPO_PAT }}
        run: |
          set -uo pipefail
          # So HTTP status, um repositorio por linha. Nenhum valor de token
          # chega perto da saida: o `gh` le a credencial do ambiente.
          alcanca=0; total=0
          for r in leilao-watch actions-engine UtilizAi richesse-club                    satoshi-s-house vektor-consultoria publio neuro-via                    emprego-portugal site-noticias-bot plataforma-educa                    hub-profissional VEKTOR-WEB-BACKUP EMPREGO-EUROPA FlashFlow; do
            total=$((total+1))
            if gh api "repos/RenatoPassos1/$r" --silent >/dev/null 2>&1; then
              echo "ALCANCA  $r"
              alcanca=$((alcanca+1))
            else
              echo "recusa   $r"
            fi
          done
          echo "RESUMO alcanca=$alcanca de=$total"
          echo "--- escrita? (leitura da permissao efetiva, sem escrever nada) ---"
          for r in leilao-watch UtilizAi richesse-club; do
            p=$(gh api "repos/RenatoPassos1/$r" --jq '.permissions | to_entries | map(select(.value)) | map(.key) | join(",")' 2>/dev/null || echo "sem-resposta")
            echo "$r: $p"
          done
