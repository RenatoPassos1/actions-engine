# LeilôAI: vigia dos alvos de automacao.
#
# ============================================================================
# O QUE ELE FAZIA, E O DEFEITO QUE ESTAVA ESCONDIDO NELE
# ============================================================================
#
# Ate 21/08/2026 este workflow tinha uma matriz com 18 enderecos de worker
# escritos aqui dentro, batia `/health` em cada um e abria ISSUE PUBLICA
# nomeando o worker quando algo falhava. Tres superficies de vazamento no
# mesmo arquivo: o YAML, o nome do job (`Pinga <slug>`) e a issue, que fica
# no repositorio para sempre.
#
# E ele estava mentindo. Medido em 21/08/2026, na ultima execucao antes da
# troca: 6 dos 18 alvos responderam 404, e o workflow terminou verde, 20 de
# 20 execucoes. Desses 6, cinco nao eram falha de saude: os alvos NAO
# EXISTEM. A Cloudflare responde `error code: 1042` para subdominio sem worker
# publicado, e o monitor tratava isso como um 404 qualquer. Em dois casos o
# endereco vigiado diferia por uma letra do endereco realmente chamado pelo
# agendador, ou seja, o monitor olhava para um lugar que nunca existiu
# enquanto o alvo de verdade rodava ao lado, sem vigia.
#
# ============================================================================
# COMO ELE FICOU
# ============================================================================
#
# A lista de alvos saiu daqui e vive no registro privado. Este workflow pede
# UMA tarefa opaca de varredura e recebe so contagem:
#
#   {"verificados":13,"saudaveis":12,"sem_rota":1,"inexistentes":0,"falhas":0}
#
# `inexistentes` e a categoria que o monitor antigo nao tinha, e e a unica que
# importa de verdade: alvo que nao existe nao vai voltar sozinho.
#
# `sem_rota` distingue o worker que esta no ar mas nao publica `/health`. Ele
# NAO reprova a execucao, porque nao e queda: e cobertura de monitoramento
# faltando, e reprovar por isso treinaria todo mundo a ignorar o alarme.
#
# Quem falhou fica no log PRIVADO do servidor, com correlacao. Nao ha mais
# issue publica com nome de alvo.

name: "LeilôAI: vigia de automacao"

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: leiloai-vigia-automacao
  cancel-in-progress: false

env:
  ALVO: https://leiloai.com/api/automation/run
  AUDIENCIA: leiloai-automation

jobs:
  vigia:
    name: varredura
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - name: Varrer alvos
        run: |
          set -uo pipefail

          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCIA}" \
            | jq -r '.value')
          if [ -z "${TOKEN:-}" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::sem token OIDC"; exit 1
          fi
          echo "::add-mask::$TOKEN"  # trava-exfiltracao: permitido -- `::add-mask::` e o mecanismo do proprio GitHub para mascarar valor obtido em tempo de execucao; o runner consome a linha e nao a imprime, e sem ela o token nao seria mascarado se aparecesse em qualquer saida posterior

          HTTP=$(printf 'header = "Authorization: Bearer %s"\n' "$TOKEN" | \
            curl -sS -o /tmp/saude.json -w '%{http_code}' -K - \
              -X POST -H 'content-type: application/json' \
              --max-time 240 -d '{"job_id":"J900"}' "$ALVO") || HTTP=000

          if [ "$HTTP" != "200" ]; then
            echo "::error::varredura nao respondeu (http=$HTTP)"
            exit 1
          fi

          VER=$(jq -r '.verificados // 0' /tmp/saude.json)
          SAU=$(jq -r '.saudaveis // 0' /tmp/saude.json)
          SEM=$(jq -r '.sem_rota // 0' /tmp/saude.json)
          INE=$(jq -r '.inexistentes // 0' /tmp/saude.json)
          FAL=$(jq -r '.falhas // 0' /tmp/saude.json)

          echo "ALVOS verificados=$VER saudaveis=$SAU sem_rota=$SEM inexistentes=$INE falhas=$FAL"
          {
            echo "verificados=$VER"
            echo "saudaveis=$SAU"
            echo "sem_rota=$SEM"
            echo "inexistentes=$INE"
            echo "falhas=$FAL"
          } >> "$GITHUB_STEP_SUMMARY"

          # Zero verificados seria varredura vazia relatada como sucesso, que e
          # a forma mais silenciosa de um monitor morrer.
          if [ "$VER" -eq 0 ]; then
            echo "::error::varredura nao olhou alvo nenhum"
            exit 1
          fi
          if [ "$INE" -gt 0 ] || [ "$FAL" -gt 0 ]; then
            echo "::error::$INE alvo(s) inexistente(s) e $FAL falha(s); detalhe no log privado"
            exit 1
          fi
          echo "VIGIA OK"
