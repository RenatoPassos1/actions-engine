name: "LeiloAI: Sonda Playwright (diagnostico)"

# Renderiza uma URL com Playwright e RELATA o que apareceu depois do JS.
# NAO grava em banco, NAO chama /ingest, nao tem segredo de Supabase.
#
# Existe porque varias fontes servem HTML sem lote nenhum e so materializam os
# cards depois do JavaScript. Antes desta sonda a unica forma de descobrir se
# uma fonte era recuperavel era cadastrar e esperar o ciclo, o que suja o
# acervo quando da errado, e foi assim que 46 itens com titulo "Lote" entraram.
#
# Roda no runner do GitHub de proposito: a VPS nao tem browser instalado, e
# sondar da maquina do dono poria o IP residencial dele nos logs dos portais.

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URLs separadas por espaco"
        type: string
        required: true
      rolar:
        description: "Rolar a pagina para materializar lazy-load"
        type: boolean
        default: true
        required: false

concurrency:
  group: leiloai-sonda-playwright
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Instalar Playwright
        run: |
          npm i -D playwright@1.58.2 --no-audit --no-fund
          npx playwright install chromium --with-deps

      - name: Sondar
        env:
          URLS: ${{ inputs.urls }}
          ROLAR: ${{ inputs.rolar }}
        run: |
          cat > sonda.mjs <<'FIMDOSCRIPT'
          import { chromium } from "playwright";

          const urls = (process.env.URLS || "").split(/\s+/).filter(Boolean);
          const rolar = process.env.ROLAR !== "false";

          // Padroes de ficha de lote, os mesmos do parser estrito do worker.
          const FICHA = /\/(?:item|lote|lotes|imovel|imoveis|bem)\/|\/detalhes|[?&](?:id|lote|item)=\d|-(?:j|ml)\d{3,}/i;

          const navegador = await chromium.launch();
          const ctx = await navegador.newContext({
            userAgent:
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
            locale: "pt-BR",
            viewport: { width: 1366, height: 900 },
          });

          for (const url of urls) {
            const pagina = await ctx.newPage();
            const linha = { url };

            // Respostas JSON que a pagina busca sozinha. E por elas que varias
            // fontes carregam os lotes, e sem ver isso a sonda so consegue
            // dizer "nao achei", sem dizer por onde procurar.
            const apis = [];
            pagina.on("response", (r) => {
              const ct = r.headers()["content-type"] || "";
              if (/json/i.test(ct) && r.request().resourceType() !== "document") {
                apis.push(r.status() + " " + r.url().slice(0, 110));
              }
            });

            try {
              const resp = await pagina.goto(url, {
                waitUntil: "domcontentloaded",
                timeout: 45000,
              });
              linha.http = resp?.status() ?? 0;

              // Antes do JS assentar: serve de comparacao com o HTML cru.
              linha.antes = await pagina.evaluate((rx) => {
                const r = new RegExp(rx.source, rx.flags);
                return [...document.querySelectorAll("a[href]")].filter((a) =>
                  r.test(a.getAttribute("href") || ""),
                ).length;
              }, { source: FICHA.source, flags: FICHA.flags });

              await pagina.waitForLoadState("networkidle", { timeout: 25000 }).catch(() => {});
              if (rolar) {
                for (let i = 0; i < 8; i++) {
                  await pagina.mouse.wheel(0, 1400);
                  await pagina.waitForTimeout(700);
                }
                await pagina.waitForTimeout(1500);
              }

              const r = await pagina.evaluate((rx) => {
                const re = new RegExp(rx.source, rx.flags);
                const unicas = [
                  ...new Set(
                    [...document.querySelectorAll("a[href]")]
                      .map((a) => a.href)
                      .filter((h) => re.test(h)),
                  ),
                ];
                const texto = document.body.innerText || "";
                const precos = (texto.match(/R\$\s*[\d.]{3,}/g) || []).length;

                // FORMAS de caminho, com numero trocado por N. Uma lista de
                // formas diz ONDE estao os lotes; a primeira URL sozinha so diz
                // qual link veio primeiro no DOM, que costuma ser menu, e foi
                // assim que a sonda insistiu em /lotes/favoritos no Sodre.
                const formas = {};
                for (const h of unicas) {
                  try {
                    const f = new URL(h).pathname.replace(/\d+/g, "N").replace(/\/$/, "");
                    formas[f] = (formas[f] || 0) + 1;
                  } catch {}
                }
                const top = Object.entries(formas)
                  .sort((a, b) => b[1] - a[1])
                  .slice(0, 6)
                  .map((e) => e[1] + "x " + e[0]);

                // ESTRUTURA do card do lote mais frequente. E o que permite
                // escrever o seletor certo: sem isto a sonda diz "achei 62
                // fichas" e nao diz como ler nenhuma delas.
                //
                // Escolhe o link da forma de caminho MAIS COMUM, nao o
                // primeiro do DOM: o primeiro costuma ser menu.
                const formaTop = Object.entries(formas).sort((a, b) => b[1] - a[1])[0]?.[0];
                let estrutura = null;
                const doTipoTop = [...document.querySelectorAll("a[href]")].find((a) => {
                  if (!re.test(a.href)) return false;
                  try {
                    return new URL(a.href).pathname.replace(/\d+/g, "N").replace(/\/$/, "") === formaTop;
                  } catch { return false; }
                });
                if (doTipoTop) {
                  let card = doTipoTop;
                  for (let i = 0; i < 7 && card; i++) {
                    if (/R\$\s*[\d.]{3,}/.test(card.innerText || "")) break;
                    card = card.parentElement;
                  }
                  card = card || doTipoTop;
                  const desc = (el) =>
                    el.tagName.toLowerCase() +
                    (el.className && typeof el.className === "string"
                      ? "." + el.className.trim().split(/\s+/).slice(0, 3).join(".")
                      : "");
                  estrutura = {
                    card: desc(card),
                    titulos: [...card.querySelectorAll("h1,h2,h3,h4,h5,[class*=titul],[class*=title],[class*=nome],[class*=name]")]
                      .slice(0, 4)
                      .map((e) => desc(e) + " => " + (e.textContent || "").replace(/\s+/g, " ").trim().slice(0, 46)),
                    texto: (card.innerText || "").replace(/\s+/g, " ").slice(0, 170),
                  };
                }

                // Amostra: sobe do link ate um ancestral com preco.
                let amostra = null;
                const primeiro = [...document.querySelectorAll("a[href]")].find((a) =>
                  re.test(a.href),
                );
                if (primeiro) {
                  let n = primeiro;
                  for (let i = 0; i < 6 && n; i++) {
                    if (/R\$\s*[\d.]{3,}/.test(n.innerText || "")) break;
                    n = n.parentElement;
                  }
                  amostra = (n?.innerText || primeiro.innerText || "")
                    .replace(/\s+/g, " ")
                    .slice(0, 170);
                }
                const imgs = [...document.querySelectorAll("img")].filter(
                  (i) => i.currentSrc && !/data:|placeholder|no-image/i.test(i.currentSrc),
                ).length;
                return { fichas: unicas.length, precos, imgs, amostra, formas: top, estrutura };
              }, { source: FICHA.source, flags: FICHA.flags });

              Object.assign(linha, r);
            } catch (e) {
              linha.erro = String(e.message).slice(0, 90);
            }
            await pagina.close();

            const partes = [
              "=== " + linha.url,
              "    http=" + (linha.http ?? "-") +
                " fichas_antes_do_js=" + (linha.antes ?? "-") +
                " fichas_depois=" + (linha.fichas ?? "-"),
              "    precos=" + (linha.precos ?? "-") + " imagens=" + (linha.imgs ?? "-"),
            ];
            if (linha.formas?.length) partes.push("    formas: " + linha.formas.join(" | "));
            if (apis.length) partes.push("    apis: " + apis.slice(0, 5).join(" | "));
            if (linha.estrutura) {
              partes.push("    CARD: " + linha.estrutura.card);
              for (const t of linha.estrutura.titulos) partes.push("      titulo> " + t);
              partes.push("      texto> " + linha.estrutura.texto);
            }
            if (linha.amostra) partes.push("    card: " + linha.amostra);
            if (linha.erro) partes.push("    ERRO: " + linha.erro);
            console.log(partes.join("\n") + "\n");

            // Educado com site de terceiro: nao ha pressa.
            await new Promise((r) => setTimeout(r, 3000));
          }

          await navegador.close();
          FIMDOSCRIPT
          node sonda.mjs 2>&1 | tee /tmp/sonda.txt

      - name: Resumo
        if: always()
        run: |
          {
            echo "## Sonda Playwright"
            echo
            echo '```'
            cat /tmp/sonda.txt 2>/dev/null | head -140
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
