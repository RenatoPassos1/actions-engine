# LeilôAI: agendador de tarefas automatizadas.
#
# ============================================================================
# O QUE MUDOU EM 21/08/2026, E POR QUE
# ============================================================================
#
# Este arquivo agendava a coleta chamando cada worker pelo endereco. Como o
# repositorio e PUBLICO, isso publicava a lista de fontes em tres superficies
# diferentes, e nenhuma delas parece um vazamento a primeira vista:
#
#   1. o YAML, com o subdominio de cada worker, que nomeia o que ele le;
#   2. o NOME DO JOB na aba Actions e na API, idem, incluindo uma matriz de 27
#      unidades federativas de uma unica fonte;
#   3. o LOG, porque cada passo fazia `tee | head -c 500` da resposta do
#      worker, que traz nome de coletor e quantidade processada.
#
# Medido no dia: 18 casamentos do lexico de fontes so neste arquivo, o maior
# de todo o repositorio.
#
# Agora o agendador conhece apenas identificadores opacos. A relacao
# `J1xx -> alvo real` vive no repositorio privado, e o servidor decide o
# destino: nao existe campo de URL, caminho ou comando nesta chamada.
#
# ============================================================================
# O QUE SAIU DAQUI, E POR QUE NAO E PERDA
# ============================================================================
#
# O job `hard_delete_lgpd` foi REMOVIDO. Ele chamava a API REST do projeto
# Supabase Cloud antigo com a chave de service role, e aquele projeto nao
# existe mais: medido em 20/08/2026, `curl: (6) Could not resolve host`, e
# falha diaria desde entao. A obrigacao continua cumprida, por outro caminho
# e melhor: a VPS roda `api/cron/lgpd-hard-delete` as 03:45, e essa rota
# anonimiza o e-mail, apaga o login e preserva as linhas fiscais, enquanto o
# DELETE cru daqui apagaria a linha inteira.
#
# Com ele saiu tambem a unica referencia deste workflow a uma chave de service
# role guardada em repositorio publico.
#
# ============================================================================
# AUTENTICACAO
# ============================================================================
#
# OIDC. Cada job pede ao GitHub um token de minutos que diz qual repositorio e
# qual workflow esta chamando, e o servidor exige as duas coisas. Nao ha
# segredo de vida longa aqui: `permissions` global e vazia, e cada job so
# pede `id-token: write`.

name: "LeilôAI: agendador"

on:
  schedule:
    - cron: "0 11 * * *"
    - cron: "0 */2 * * *"
    - cron: "0 3 * * *"
    - cron: "15 */4 * * *"
    - cron: "0 9 * * *"
    - cron: "20 */3 * * *"
    - cron: "30 */12 * * *"
    - cron: "40 */6 * * *"
    - cron: "50 */6 * * *"
  workflow_dispatch:
    inputs:
      grupo:
        description: "Grupo a executar (G1..G9), ou todos"
        required: true
        default: "todos"
        type: choice
        options: [todos, G1, G2, G3, G4, G5, G6, G7, G8, G9]

permissions: {}

concurrency:
  group: leiloai-agendador-${{ github.event.schedule || github.event.inputs.grupo }}
  cancel-in-progress: false

env:
  ALVO: https://leiloai.com/api/automation/run
  AUDIENCIA: leiloai-automation

jobs:
  # ==========================================================================
  # Decide o que rodar. Roda codigo fixo deste arquivo, sem credencial nenhuma.
  # ==========================================================================
  alvos:
    name: resolver alvos
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      lista: ${{ steps.calc.outputs.lista }}
    steps:
      - name: Calcular lista de tarefas
        id: calc
        env:
          AGENDA: ${{ github.event.schedule }}
          GRUPO: ${{ github.event.inputs.grupo }}
        run: |
          set -euo pipefail

          # Grupos. O numero e opaco de proposito: nao diz o que faz nem
          # quantas fontes ha por familia.
          # J106 SAIU DAQUI EM 21/08/2026, e o motivo e dono duplicado.
          #
          # Medido: o mesmo coletor era acionado por DOIS agendadores. Este
          # grupo o disparava 1x por dia (cron das 11:00 UTC), e o cron da VPS
          # dispara os 4 shards de 4, cada um a cada 30 minutos, cobrindo o
          # conjunto inteiro 2x por hora.
          #
          # Nao era escrita dupla de dados diferentes: os dois caminhos chamam o
          # MESMO worker, e o upsert dele absorve repeticao. Mas a policy de
          # execucao proibe dois agendadores autoritativos, e proibe
          # explicitamente manter VPS e Actions em paralelo "por redundancia":
          # failover e troca de dono declarada, nao dois donos ao mesmo tempo.
          #
          # O plano autoritativo de agregadores e a VPS, por cobertura (4 shards
          # contra nenhum) e por cadencia (96x mais frequente).
          #
          # Isto foi encontrado pelo validador `validar-execution-plane.mjs`,
          # depois que um review mostrou que a comparacao por substring dele
          # nunca disparava: os alvos sao `ingest-*` e os scripts sao `run-*`,
          # entao nenhum continha o outro e a regra respondia zero para sempre.
          g1='{"id":"J101"},{"id":"J103"},{"id":"J104"},{"id":"J105"}'
          g2='{"id":"J102"}'
          g3='{"id":"J110"}'
          g4='{"id":"J107"}'
          g5='{"id":"J108"},{"id":"J114"}'
          g6='{"id":"J109"}'
          # G7 estava DESLIGADO desde 06/05/2026 (`if: false`, com a nota
          # "worker retorna 404"). Religado em 21/08/2026 DEPOIS de medir, a
          # partir da VPS: `/health` do alvo responde 200. Sem a medicao,
          # religar deixaria o agendador vermelho a cada 12 h e o vigia
          # vermelho a cada 30 min, que e alarme que se aprende a ignorar.
          g7='{"id":"J111"}'
          g8='{"id":"J112"}'
          # G9 e dividido em 27 partes. O indice nao revela para que serve.
          g9=""
          for i in $(seq 1 27); do
            g9="${g9}${g9:+,}{\"id\":\"J113\",\"parte\":$i}"
          done

          escolher() {
            case "$1" in
              G1) printf '%s' "$g1" ;; G2) printf '%s' "$g2" ;; G3) printf '%s' "$g3" ;;
              G4) printf '%s' "$g4" ;; G5) printf '%s' "$g5" ;; G6) printf '%s' "$g6" ;;
              G7) printf '%s' "$g7" ;; G8) printf '%s' "$g8" ;; G9) printf '%s' "$g9" ;;
              *) printf '' ;;
            esac
          }

          if [ -n "${AGENDA:-}" ]; then
            case "$AGENDA" in
              "0 11 * * *")    ITENS=$(escolher G1) ;;
              "0 */2 * * *")   ITENS=$(escolher G2) ;;
              "0 3 * * *")     ITENS=$(escolher G3) ;;
              "15 */4 * * *")  ITENS=$(escolher G4) ;;
              "0 9 * * *")     ITENS=$(escolher G5) ;;
              "20 */3 * * *")  ITENS=$(escolher G6) ;;
              "30 */12 * * *") ITENS=$(escolher G7) ;;
              "40 */6 * * *")  ITENS=$(escolher G8) ;;
              "50 */6 * * *")  ITENS=$(escolher G9) ;;
              *) ITENS="" ;;
            esac
          elif [ "${GRUPO:-todos}" = "todos" ]; then
            ITENS="$g1,$g2,$g3,$g4,$g5,$g6,$g7,$g8,$g9"
          else
            # `type: choice` ja restringe, e a allowlist abaixo e a trava real:
            # entrada que nao casa vira lista vazia, nunca destino.
            ITENS=$(escolher "${GRUPO}")
          fi

          if [ -z "$ITENS" ]; then
            echo "lista=[]" >> "$GITHUB_OUTPUT"
            echo "nada a fazer"
            exit 0
          fi
          echo "lista=[$ITENS]" >> "$GITHUB_OUTPUT"
          echo "tarefas: $(printf '[%s]' "$ITENS" | grep -o '"id"' | wc -l)"

  # ==========================================================================
  # Dispara. O nome do job que aparece publicamente e o id opaco.
  # ==========================================================================
  disparo:
    name: ${{ matrix.alvo.id }}${{ matrix.alvo.parte && format('.{0}', matrix.alvo.parte) || '' }}
    needs: alvos
    if: needs.alvos.outputs.lista != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      # Teto conservador: a fonte dividida em 27 partes passaria a bater no
      # servidor do produto, e nao mais direto no worker. 6 por vez mantem a
      # vazao e nao transforma o agendador em teste de carga.
      max-parallel: 6
      matrix:
        alvo: ${{ fromJson(needs.alvos.outputs.lista) }}
    steps:
      - name: Disparar tarefa
        env:
          ID: ${{ matrix.alvo.id }}
          PARTE: ${{ matrix.alvo.parte }}
        run: |
          set -uo pipefail

          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCIA}" \
            | jq -r '.value')
          if [ -z "${TOKEN:-}" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::sem token OIDC"; exit 1
          fi
          echo "::add-mask::$TOKEN"  # trava-exfiltracao: permitido -- `::add-mask::` e o mecanismo do proprio GitHub para mascarar valor obtido em tempo de execucao; o runner consome a linha e nao a imprime, e sem ela o token nao seria mascarado se aparecesse em qualquer saida posterior

          if [ -n "${PARTE:-}" ]; then
            CORPO=$(printf '{"job_id":"%s","parte":%s}' "$ID" "$PARTE")
          else
            CORPO=$(printf '{"job_id":"%s"}' "$ID")
          fi

          # Ate 3 tentativas. `-K -` mantem o token fora da linha de comando.
          # 660 e nao 600: o maior teto do lado servidor E 600 s. Com
          # `--max-time 600` o curl desistiria SEMPRE primeiro, o caminho
          # `em_execucao` nunca seria alcancado, e a retentativa chegaria fora
          # da janela de idempotencia disparando o mesmo coletor uma segunda
          # vez, em paralelo com o primeiro, contra host de terceiro.
          rc=1
          for tentativa in 1 2 3; do
            HTTP=$(printf 'header = "Authorization: Bearer %s"\n' "$TOKEN" | \
              curl -sS -o /tmp/resp.json -w '%{http_code}' -K - \
                -X POST -H 'content-type: application/json' \
                --max-time 660 -d "$CORPO" "$ALVO") || HTTP=000
            ESTADO_PARCIAL=$(jq -r '.estado // ""' /tmp/resp.json 2>/dev/null || echo "")
            case "$HTTP" in
              # `duplicado` significa "outra chamada recente ja marcou esta
              # tarefa", e NAO "a tarefa rodou". Aceitar como sucesso e o que
              # transformava o mecanismo de retry em conversor de falha em
              # verde: a tentativa 1 recebia 502, a 2 encontrava a marca e
              # recebia 200, o `case 2*` zerava o codigo de retorno e o job
              # terminava verde sem nada ter sido disparado.
              2*)
                if [ "$ESTADO_PARCIAL" = "duplicado" ]; then
                  echo "tentativa $tentativa: resposta duplicado, nao conclusivo"
                  sleep 20
                else
                  rc=0; break
                fi
                ;;
              429) echo "tentativa $tentativa: teto de taxa"; sleep 30 ;;
              *)   echo "tentativa $tentativa: http=$HTTP"; sleep 15 ;;
            esac
          done

          # A resposta so tem estado e correlacao. Sem nome de alvo, sem
          # contagem: era exatamente isso que ia para o log antes.
          ESTADO=$(jq -r '.estado // "sem_estado"' /tmp/resp.json 2>/dev/null || echo "ilegivel")
          echo "TAREFA $ID${PARTE:+.$PARTE} http=$HTTP estado=$ESTADO"

          if [ "$rc" -ne 0 ]; then
            echo "::error::tarefa nao aceita apos 3 tentativas (http=$HTTP)"
            exit 1
          fi
