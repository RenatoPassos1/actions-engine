# LeilôAI: sincroniza DISPARO_SECRET nos workers Cloudflare.
#
# ============================================================================
# POR QUE EXISTE
# ============================================================================
#
# O agendador manda o header `x-disparo-secret` e cada worker valida contra o
# proprio segredo. Se o valor divergir, o worker devolve 401 e a coleta daquela
# familia para sem que nada mais acuse. Este workflow poe o MESMO valor em
# todos, de uma vez.
#
# ============================================================================
# O QUE MUDOU EM 21/08/2026
# ============================================================================
#
# Ele tinha uma matriz com VINTE diretorios escritos aqui dentro, um por
# worker, e cada nome dizia que fonte aquele worker le. Como este repositorio
# e publico, era a lista de coleta do produto em YAML aberto, e ela reaparecia
# no nome de cada job da matriz e no resumo de cada execucao.
#
# Agora a lista sai do CLONE, em tempo de execucao: quem tem `wrangler.toml`
# e alvo. A saida publica e contagem, e o nome do job nao diz nada.
#
# A entrada tambem mudou. Ela era `worker: <nome>`, ou seja, o operador
# digitava o nome de uma fonte num campo de workflow publico, e entrada de
# workflow publico E superficie publica. Virou indice: `parte: N` de M, com o
# mapa indice -> alvo existindo so dentro do clone.
#
# ============================================================================
# O SEGREDO NAO PASSA POR argv
# ============================================================================
#
# `printf | wrangler secret put` manda o valor por stdin. Escrever
# `wrangler secret put --value "$X"` poria a chave em `ps` de qualquer
# processo da maquina enquanto o comando roda.

name: "LeilôAI: Sync DISPARO_SECRET"

on:
  workflow_dispatch:
    inputs:
      parte:
        description: "Indice do alvo (1..N). Vazio ou 0 = todos."
        type: string
        required: false
        default: "0"

concurrency:
  group: leiloai-sync-disparo
  cancel-in-progress: false

permissions: {}

env:
  REPO_PRIVADO: RenatoPassos1/leilao-watch
  BRANCH: feat/landing

jobs:
  sincronizar:
    name: sincronizar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # O UNICO step com credencial de leitura do repositorio privado. Mesmo
      # desenho do CI publico: a chave nasce num `mktemp` 600 e morre com
      # `shred` na linha seguinte, antes de qualquer outro passo.
      - name: Checkout do repositorio privado (unico step com credencial)
        env:
          CHAVE: ${{ secrets.LEILOAI_CHECKOUT_KEY }}
        run: |
          set -euo pipefail
          ARQCH="$(mktemp)"; chmod 600 "$ARQCH"
          KH="$(mktemp)"
          trap 'shred -u "$ARQCH" 2>/dev/null || rm -f "$ARQCH"; rm -f "$KH"' EXIT

          printf '%s' "$CHAVE" > "$ARQCH"
          printf '\n' >> "$ARQCH"

          curl -sS --max-time 20 https://api.github.com/meta > /tmp/gh-meta.json
          jq -r '.ssh_keys[] | "github.com " + .' /tmp/gh-meta.json > "$KH"
          rm -f /tmp/gh-meta.json
          [ -s "$KH" ] || { echo "::error::nao obtive as chaves de host do github"; exit 1; }

          export GIT_SSH_COMMAND="ssh -i $ARQCH -o IdentitiesOnly=yes -o UserKnownHostsFile=$KH -o StrictHostKeyChecking=yes -o BatchMode=yes"

          git init -q .
          git remote add origin "git@github.com:$REPO_PRIVADO.git"
          git fetch -q --depth 1 origin "$BRANCH"
          git checkout -q FETCH_HEAD

          shred -u "$ARQCH" 2>/dev/null || rm -f "$ARQCH"
          rm -f "$KH"
          trap - EXIT
          unset GIT_SSH_COMMAND
          echo "CHECKOUT ok"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.1.0
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Sincronizar
        env:
          DISPARO: ${{ secrets.LEILOAI_DISPARO_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.LEILOAI_CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.LEILOAI_CF_ACCOUNT }}
          PARTE: ${{ inputs.parte }}
        run: |
          set -uo pipefail

          # A lista sai do clone, e nunca deste arquivo. Ordenada para o
          # indice ser estavel entre execucoes.
          mapfile -t ALVOS < <(find services -mindepth 2 -maxdepth 2 -name wrangler.toml -printf '%h\n' | sort)
          N=${#ALVOS[@]}
          if [ "$N" -eq 0 ]; then
            echo "::error::nenhum alvo encontrado no clone; o layout mudou?"
            exit 1
          fi
          echo "ALVOS $N"

          # Indice, nunca nome. Fora da faixa e recusa, nao "todos".
          P="${PARTE:-0}"
          printf '%s' "$P" | grep -qE '^[0-9]+$' || { echo "::error::parte precisa ser numero"; exit 1; }
          if [ "$P" -gt "$N" ]; then
            echo "::error::parte fora da faixa (1..$N)"
            exit 1
          fi

          if [ "$P" -eq 0 ]; then
            SELECIONADOS=("${ALVOS[@]}")
          else
            SELECIONADOS=("${ALVOS[$((P - 1))]}")
          fi

          ok=0; falhas=0
          for i in "${!SELECIONADOS[@]}"; do
            d="${SELECIONADOS[$i]}"
            # `printf | wrangler` manda por stdin: o valor nunca vai para argv.
            if ( cd "$d" && printf '%s' "$DISPARO" | wrangler secret put DISPARO_SECRET >/dev/null 2>&1 ); then
              ok=$((ok + 1))
            else
              falhas=$((falhas + 1))
              # Indice, nao caminho: caminho nomeia a fonte.
              echo "::warning::alvo #$((i + 1)) recusou a sincronizacao"
            fi
          done

          echo "SYNC alvos=${#SELECIONADOS[@]} ok=$ok falhas=$falhas"
          {
            echo "alvos=${#SELECIONADOS[@]}"
            echo "ok=$ok"
            echo "falhas=$falhas"
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$falhas" -eq 0 ] || exit 1
