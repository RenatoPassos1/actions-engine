# ============================================================================
# LeiloAI - vigia externo do HTTP publico.
# ============================================================================
#
# Externo de proposito: o monitor que vive na VPS (`scripts/vps/monitor-leiloai.sh`)
# morre junto com ela, e foi o que aconteceu em 21/10/2026. Este corre no
# GitHub, fora da infraestrutura vigiada.
#
# POR QUE UM LACO LONGO E NAO UM CRON CURTO: o `*/5` abaixo continua declarado,
# mas ele NAO governa a cadencia. Medido em 02/11/2026 sobre as 200 corridas
# mais recentes: intervalo mediano de 275 min e maior intervalo de 617 min, com
# 3 a 8 corridas por dia em vez das 288 pedidas. E nao e deste workflow: o
# `leiloai-indexnow-hourly` (declara `0 * * * *`) deu 283 min de mediana e o
# `leiloai-cron-monitor` (declara `*/30`) deu 284 min. Tres cadencias
# declaradas, uma cadencia real. Este repositorio tem 40 workflows com
# `schedule:` e o agendador do GitHub entrega ~5 eventos por dia.
#
# Entao o job NAO termina depois de uma sondagem: ele fica ~5h30 sondando de 2
# em 2 minutos. Com `cancel-in-progress: false`, a corrida seguinte espera na
# fila e assume quando esta acabar. O agendador so precisa acertar uma vez a
# cada 5h30.
#
# A logica toda vive em `.github/scripts/leiloai-uptime-vigia.sh`, com teste
# em `testar-uptime-vigia.sh`: codigo num `run:` de YAML nao tem como ser
# exercitado antes de ir para producao.
# ============================================================================

name: "LeiloAI: Uptime Check"

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      minutos:
        description: "Duracao do laco em minutos (o tecto do job e 350)"
        required: false
        default: "330"

permissions:
  issues: write
  contents: read

concurrency:
  group: leiloai-uptime-check
  cancel-in-progress: false

jobs:
  vigia:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Vigia o HTTP publico
        env:
          GH_TOKEN: ${{ github.token }}
          UPTIME_REPO: ${{ github.repository }}
          UPTIME_MINUTOS: ${{ github.event.inputs.minutos || '330' }}
        run: bash .github/scripts/leiloai-uptime-vigia.sh vigia
