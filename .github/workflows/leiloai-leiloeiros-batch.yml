# LeilôAI - Batch Playwright dos 585 leiloeiros oficiais
#
# Pega todos os sources `type=aggregator` com id LIKE 'leiloeiro-nucleo-%'
# do Supabase, filtra por `last_run_at` (prioriza os que nao rodaram ha
# mais tempo), processa em batch de 100 por run (~15-20 min).
#
# Com 585 leiloeiros e cron 6x/dia, cada leiloeiro e visitado a cada
# ~1 dia em media. Processamento: Playwright headless intercepta
# responses JSON + extrai DOM + detecta card patterns por fonte_id.
# POSTa em /ingest do worker agregadores (Cloudflare).
#
# Secrets necessarios:
#   LEILOAI_DISPARO_SECRET
#   LEILOAI_SUPABASE_URL
#   LEILOAI_SUPABASE_SR
#   LEILOAI_AGREGADORES_URL (opcional, default workers.dev)

name: "LeilôAI: Leiloeiros Batch (Playwright)"

on:
  schedule:
    # 4x/dia: 05h, 11h, 17h, 23h UTC = 02h, 08h, 14h, 20h BRT
    - cron: "0 5,11,17,23 * * *"
  workflow_dispatch:
    inputs:
      limite:
        description: "Quantos leiloeiros processar neste run (default 100, max 200)"
        required: false
        default: "100"
        type: string
      fonte_id:
        description: "Filtrar por fonte_id especifico (vazio = todos)"
        required: false
        default: ""
        type: string
      forcar:
        description: "Ignorar last_run_at (roda todos)"
        required: false
        default: "false"
        type: boolean

concurrency:
  # Um grupo por fonte_id permite paralelismo (diferentes fontes em paralelo).
  # Cancelamento diferente por shard.
  group: leiloai-leiloeiros-batch-${{ github.event.inputs.fonte_id || 'all' }}
  cancel-in-progress: false

env:
  AGREGADORES_URL: ${{ secrets.LEILOAI_AGREGADORES_URL || 'https://leiloai-ingest-agregadores.renatopassos516.workers.dev' }}

jobs:
  scrape:
    name: Playwright batch leiloeiros (fonte=${{ github.event.inputs.fonte_id || 'all' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install Playwright + chromium
        run: |
          mkdir -p /tmp/lei && cd /tmp/lei
          npm init -y >/dev/null
          npm install playwright@1
          npx playwright install chromium --with-deps

      - name: Scrape leiloeiros em batch
        working-directory: /tmp/lei
        env:
          DISPARO: ${{ secrets.LEILOAI_DISPARO_SECRET }}
          SUPABASE_URL: ${{ secrets.LEILOAI_SUPABASE_URL }}
          SR: ${{ secrets.LEILOAI_SUPABASE_SR }}
          LIMITE: ${{ github.event.inputs.limite || '100' }}
          FONTE_ID: ${{ github.event.inputs.fonte_id || '' }}
          FORCAR: ${{ github.event.inputs.forcar || 'false' }}
        run: |
          cat > /tmp/lei/batch.mjs <<'EOF'
          import { chromium } from "playwright";

          // Helper injetado em toda pagina (ctx.addInitScript). O $$eval nao
          // enxerga o escopo do Node, entao a extracao de foto/praca/veiculo
          // vive aqui e e chamada como window.__lai.extras(...).
          // String.raw: template literal comum comeria os \d, \s das regex.
          const HELPERS_BROWSER = String.raw`
          window.__lai = (function () {
            // Rejeita o que nao e foto do bem. Medido em 04/08/2026 no megaleiloes:
            // placeholder card-no-image-320x240.png, icone auction-gavet.png (background
            // do link "adicionar ao auditorio") e logo do banco em /bank_icons/. No
            // sodresantoro: banner de campanha em /banners/ (foto real em /photos/).
            var RUIM = /favicon|placeholder|sem[-_]?(foto|imagem)|no[-_]?image|nophoto|spinner|loading|blank\.|1x1|pixel|gavet|sprite|whats|facebook|instagram|youtube/i;
            var CAMINHO_RUIM = /\/(bank_icons?|icons?|sprites?|logos?|banners?|flags?|avatars?|selos?|badges?|bandeiras?)\//i;
            var EXT = /\.(jpe?g|png|webp|avif)(?:[?#]|$)/i;
            var MIDIA = /\/(batches?|lotes?|bens?|imagens?|images?|fotos?|photos?|thumbs?|media|uploads?|arquivos?|storage|cdn)\//i;
            var ATTRS = ["data-bg","data-background","data-background-image","data-src","data-original",
                         "data-lazy","data-lazy-src","data-echo","data-image","src","data-srcset","srcset"];

            function limpar(bruto, base) {
              if (!bruto) return null;
              // srcset vem "url 320w, url 640w": fica com a primeira URL
              var u = String(bruto).trim().split(",")[0].trim().split(/\s+/)[0];
              if (!u || /^(data|blob|javascript|about):/i.test(u)) return null;
              var abs;
              try { abs = new URL(u, base).toString(); } catch (e) { return null; }
              if (RUIM.test(abs) || CAMINHO_RUIM.test(abs)) return null;
              if (!EXT.test(abs) && !MIDIA.test(abs)) return null;
              return abs;
            }

            function daCss(valor, base) {
              if (!valor || valor === "none") return null;
              var m = String(valor).match(/url\(\s*["']?(.*?)["']?\s*\)/i);
              return m ? limpar(m[1], base) : null;
            }

            // A foto do card raramente e <img src>: muitos agregadores usam
            // background-image (inline ou via lazyload em data-bg). Cobre os dois.
            function imagens(raiz, base, max) {
              var lim = max || 4;
              var out = [];
              function add(u) { if (u && out.indexOf(u) === -1 && out.length < lim) out.push(u); }
              if (!raiz || raiz.nodeType !== 1) return out;
              var alvos = [];
              try {
                alvos = Array.prototype.slice.call(raiz.querySelectorAll(
                  "img, source, [data-bg], [data-background], [data-background-image], [data-src]," +
                  "[class*='image'], [class*='imagem'], [class*='foto'], [class*='photo']," +
                  "[class*='thumb'], [class*='picture'], figure, picture"
                ));
              } catch (e) {}
              try { if (raiz.matches("img,[data-bg],[data-src],[class*='image'],[class*='foto'],[class*='photo'],[class*='thumb']")) alvos.unshift(raiz); } catch (e) {}
              for (var i = 0; i < alvos.length && out.length < lim; i++) {
                var el = alvos[i];
                for (var a = 0; a < ATTRS.length; a++) add(limpar(el.getAttribute(ATTRS[a]), base));
                if (el.currentSrc) add(limpar(el.currentSrc, base));
                var st = el.getAttribute("style");
                if (st && st.indexOf("background") !== -1) add(daCss(st, base));
                if (!out.length) { try { add(daCss(getComputedStyle(el).backgroundImage, base)); } catch (e) {} }
              }
              if (!out.length) {
                var bgs = raiz.querySelectorAll("[style*='background']");
                for (var j = 0; j < bgs.length && !out.length; j++) add(daCss(bgs[j].getAttribute("style"), base));
              }
              return out;
            }

            // Do link para fora, parando no primeiro ancestral que tem foto. Sem isso
            // o sodresantoro devolvia a foto do lote vizinho: o closest(".card, li")
            // dele cai num container que embrulha varios lotes.
            function imagensPerto(link, bloco, base, max) {
              var nos = [];
              var no = link && link.nodeType === 1 ? link : bloco;
              for (var n = 0; n < 8 && no; n++) {
                nos.push(no);
                if (no === bloco) break;
                no = no.parentElement;
              }
              if (bloco && nos.indexOf(bloco) === -1) nos.push(bloco);
              for (var i = 0; i < nos.length; i++) {
                var r = imagens(nos[i], base, max);
                if (r.length) return r;
              }
              return [];
            }

            function txt(el) { return el && el.textContent ? el.textContent.replace(/\s+/g, " ").trim() : ""; }

            // "R$ 28.509,60" -> 28509.6. Precisa sair do scraper ja numerico: o
            // numOuNull do worker faz replace(",", ".") sem tirar o separador de
            // milhar, entao "10.000,00" vira "10.000.00" -> NaN -> null.
            function preco(t) {
              if (t === null || t === undefined) return null;
              if (typeof t === "number") return isFinite(t) && t > 0 ? t : null;
              var m = String(t).replace(/\s+/g, " ").match(/(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+,\d{1,2}|\d+(?:\.\d{1,2})?)/);
              if (!m) return null;
              var b = m[1], n;
              if (/,\d{1,2}$/.test(b)) n = Number(b.replace(/\./g, "").replace(",", "."));
              else if (/\.\d{3}/.test(b)) n = Number(b.replace(/\./g, ""));
              else n = Number(b);
              return isFinite(n) && n > 0 ? n : null;
            }

            var RE_DATA = /(\d{2})\/(\d{2})\/(\d{4})(?:\s*(?:às|as|-|,)?\s*(\d{1,2})[:h](\d{2}))?/;
            // dd/mm/aaaa [as hh:mm] -> ISO no fuso do Brasil. Sem hora, meio-dia,
            // para nao virar o dia ao converter para UTC.
            function iso(texto) {
              if (!texto) return null;
              var m = String(texto).match(RE_DATA);
              if (!m) return null;
              var ano = Number(m[3]);
              if (ano < 2000 || ano > 2100) return null;
              var h = m[4] ? ("0" + m[4]).slice(-2) : "12";
              return m[3] + "-" + m[2] + "-" + m[1] + "T" + h + ":" + (m[5] || "00") + ":00-03:00";
            }

            // 1a/2a praca. Seletores medidos no megaleiloes
            // (.card-first-instance-date / .card-second-instance-date, valor no
            // .card-instance-value irmao); fallback por rotulo no texto do card serve
            // o resto dos agregadores.
            function pracas(raiz) {
              var r = { primeira: null, segunda: null, lance_segunda: null };
              if (!raiz || raiz.nodeType !== 1) return r;
              var e1 = raiz.querySelector("[class*='first-instance-date'], .primeira-praca, .data-primeira-praca");
              var e2 = raiz.querySelector("[class*='second-instance-date'], .segunda-praca, .data-segunda-praca");
              r.primeira = iso(txt(e1));
              r.segunda = iso(txt(e2));
              if (e2 && e2.parentElement) {
                var v = e2.parentElement.querySelector("[class*='instance-value'], .valor, .value, .preco");
                if (v) r.lance_segunda = preco(txt(v));
              }
              var t = txt(raiz);
              if (!r.primeira) {
                var m1 = t.match(/(?:1[ª°a]?\s*pra[çc]a|primeira\s+pra[çc]a|1[ª°a]?\s*leil[ãa]o|data\s*(?:do\s*)?leil[ãa]o|abertura)\s*:?\s*([^|]{0,32})/i);
                r.primeira = iso(m1 && m1[1]);
              }
              if (!r.segunda) {
                var m2 = t.match(/(?:2[ª°a]?\s*pra[çc]a|segunda\s+pra[çc]a|2[ª°a]?\s*leil[ãa]o)\s*:?\s*([^|]{0,32})/i);
                r.segunda = iso(m2 && m2[1]);
              }
              return r;
            }

            // Ano/marca/modelo so quando o item e mesmo veiculo. O card do megaleiloes
            // nao tem campo estruturado: o dado esta no titulo
            // ("Carro Hyundai Tucson GLSB - 2011/2012"). Sem marca reconhecida, null.
            var MARCAS = ["Chevrolet","Volkswagen","Fiat","Ford","Toyota","Honda","Hyundai","Renault",
              "Nissan","Peugeot","Citroën","Citroen","Jeep","Mitsubishi","Kia","Chery","Caoa","Suzuki",
              "Subaru","BMW","Mercedes-Benz","Mercedes","Audi","Volvo","Land Rover","Jaguar","Porsche",
              "Iveco","Scania","Agrale","Troller","JAC","Effa","Lifan","RAM","Dodge","Chrysler","Yamaha",
              "Kawasaki","Harley-Davidson","Ducati","Triumph","Shineray","Dafra","Sundown","Traxx","Haojue",
              "Royal Enfield","BYD","GWM","Foton","Marcopolo","Randon","New Holland","Massey Ferguson",
              "Valtra","John Deere","Komatsu","Caterpillar","Yanmar","Hafei","Sinotruk","Mini","VW","GM"];
            var RE_VEIC = /ve[í i]cul|carro|autom[oó]vel|motocicl|moto\b|caminh[aã]o|caminhon|[oô]nibus|reboque|trator|sucata|van\b|utilit[aá]ri|semirreboque|quadricicl|lancha|embarca/i;

            function veiculo(titulo, url) {
              var out = { year: null, brand: null, model: null };
              var t = String(titulo || "");
              var u = String(url || "");
              if (!RE_VEIC.test(t) && !/\/(veiculos?|carros?|motos?|caminhoes|caminh[oõ]es|sucatas?)\//i.test(u)) return out;
              // "2011/2012" = fabricacao/modelo: vale o ano modelo (o segundo)
              var par = t.match(/\b(19[5-9]\d|20[0-4]\d)\s*[\/\-]\s*(19[5-9]\d|20[0-4]\d)\b/);
              if (par) out.year = Number(par[2]);
              if (!out.year) {
                var so = t.match(/(?:^|[\s\-,(])(19[5-9]\d|20[0-4]\d)(?:$|[\s\-,)])/);
                if (so) out.year = Number(so[1]);
              }
              var alvo = t.replace(/ë/g, "e");
              for (var i = 0; i < MARCAS.length; i++) {
                var marca = MARCAS[i];
                var re = new RegExp("(?:^|[\\s\\/,.\\-(])" + marca.replace(/[-\/\\^$*+?.()|[\]{}]/g, "\\$&").replace(/ë/g, "e") + "(?=$|[\\s\\/,.\\-)])", "i");
                var m = alvo.match(re);
                if (!m) continue;
                out.brand = marca;
                var resto = alvo.slice(m.index + m[0].length);
                var modelo = resto.split(/\s+[\-–]\s+|,|\||\d{4}\s*\//)[0].replace(/^[\s\/\-,.]+/, "").trim();
                out.model = modelo ? modelo.slice(0, 60) : null;
                break;
              }
              return out;
            }

            // Junta os campos novos num objeto pronto para o /ingest do worker.
            // O parametro link (opcional) e a ancora do lote: com ela a foto sai do
            // container mais justo, sem pegar a do vizinho.
            function extras(raiz, base, titulo, url, link) {
              var imgs = imagensPerto(link, raiz, base, 4);
              var p = pracas(raiz);
              var v = veiculo(titulo, url);
              return {
                images: imgs.length ? imgs : null,
                first_auction_at: p.primeira,
                second_auction_at: p.segunda,
                second_bid: p.lance_segunda,
                year: v.year,
                brand: v.brand,
                model: v.model,
              };
            }

            return { imagens: imagens, imagensPerto: imagensPerto, pracas: pracas, veiculo: veiculo, extras: extras, iso: iso, preco: preco };
          })();
          `;

          const AGG = process.env.AGREGADORES_URL;
          const DISPARO = process.env.DISPARO;
          const SB_URL = process.env.SUPABASE_URL;
          const SR = process.env.SR;
          const LIMITE = parseInt(process.env.LIMITE || "100", 10);
          const FONTE_ID = process.env.FONTE_ID || "";
          const FORCAR = process.env.FORCAR === "true";
          const LIMIT_HARD = Math.min(LIMITE, 500);
          const TIMEOUT_PAGE_MS = 20_000;
          const BUDGET_MS = 25 * 60 * 1000; // 25 min budget (timeout workflow = 30 min)
          const INICIO = Date.now();

          if (!DISPARO || !SB_URL || !SR) {
            throw new Error("Secrets faltando: LEILOAI_DISPARO_SECRET, LEILOAI_SUPABASE_URL, LEILOAI_SUPABASE_SR");
          }

          // 1) Busca leiloeiros priorizando os que ja rodaram ha mais tempo
          // Suporte a fonte_id dummy "all-*" para concorrencia (grupo diferente sem filtrar por fonte real)
          const fonteIdReal = FONTE_ID && !FONTE_ID.startsWith("all-") ? FONTE_ID : "";
          const filtroFonte = fonteIdReal ? `&metadata->>fonte_id=eq.${fonteIdReal}` : "";
          const filtroTempo = FORCAR ? "" : `&or=(last_run_at.is.null,last_run_at.lt.${encodeURIComponent(new Date(Date.now() - 12*3600*1000).toISOString())})`;
          // Inclui todos os prefixos de sources que precisam Playwright:
          // leiloeiro-* (645+ leiloeiros Nucleo e por UF),
          // agg-* (agregadores nacionais SPA),
          // bank-* (bancos com leiloes SPA),
          // plat-* (plataformas especializadas),
          // gov-* (portais governamentais),
          // niche-* (leiloes nicho: rural, animal, embarcacao)
          const urlQuery = `${SB_URL}/rest/v1/sources?` +
            `select=id,name,base_url,metadata,last_run_at` +
            `&or=(id.like.leiloeiro-*,id.like.agg-*,id.like.bank-*,id.like.plat-*,id.like.gov-*,id.like.niche-*)&status=eq.active${filtroFonte}${filtroTempo}` +
            `&order=last_run_at.asc.nullsfirst&limit=${LIMIT_HARD}`;
          const rSel = await fetch(urlQuery, {
            headers: { apikey: SR, authorization: `Bearer ${SR}` },
          });
          if (!rSel.ok) throw new Error(`DB query: HTTP ${rSel.status}`);
          const fontes = await rSel.json();
          console.log(`Processando ${fontes.length} leiloeiros`);
          if (!fontes.length) {
            console.log("Nenhum leiloeiro elegivel agora");
            process.exit(0);
          }

          // 2) Launch chromium
          const browser = await chromium.launch({ headless: true });
          const ctx = await browser.newContext({
            userAgent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36 LeiloAI-Crawler/1.0",
            locale: "pt-BR",
            viewport: { width: 1366, height: 900 },
            bypassCSP: true,
          });
          await ctx.addInitScript({ content: HELPERS_BROWSER });

          const resumo = {ok:0, vazios:0, erros:0, total_inseridos:0, detalhes:[]};

          for (const fonte of fontes) {
            if (Date.now() - INICIO > BUDGET_MS) {
              console.log(`Budget 25min atingido, parando. Processados: ${resumo.ok + resumo.vazios + resumo.erros}/${fontes.length}`);
              break;
            }

            const label = `${fonte.id} ${fonte.base_url}`;
            const page = await ctx.newPage();
            const respJSON = [];
            page.on("response", async (resp) => {
              const ct = resp.headers()["content-type"] ?? "";
              if (!ct.includes("json")) return;
              if (!/imov|leilo|lote|busca|search|catalog|propert|ativo/i.test(resp.url())) return;
              try { respJSON.push(await resp.json()); } catch {}
            });
            // Abortar as fontes economizava alguns KB mas ligava a interceptacao
            // de requests da pagina inteira, e ai o SPA do sodresantoro nao
            // renderizava lote nenhum: 0 link de lote e 0 foto, reproduzido 2x em
            // 04/08/2026, contra 48 lotes e 96 fotos com a rota desligada.
            // ATENCAO: sozinho isso ainda nao destrava o sodresantoro. O
            // `await resp.json()` dentro do page.on("response") logo abaixo trava
            // o SPA do mesmo jeito (medido isoladamente). Enquanto os dois nao
            // sairem, aquela fonte continua devolvendo so link de menu.
            // await page.route(/\.(woff2?|ttf|otf|eot)$/i, r => r.abort());

            let items = [];
            let erro = null;
            try {
              await page.goto(fonte.base_url, { timeout: TIMEOUT_PAGE_MS, waitUntil: "domcontentloaded" });
              // Aguarda 3s para carregar cards iniciais + scroll para lazy.
              // O scroll e gradual, nao um pulo para o rodape: o lazyload so
              // carrega a foto do card que passa pela viewport. Medido no
              // sodresantoro: pulando para o fim, 36 items e 0 fotos; passando
              // de 1/4 em 1/4, 125 items e 96 fotos, no mesmo tempo.
              await page.waitForTimeout(2500);
              for (let s = 1; s <= 4; s++) {
                await page.evaluate((n) => window.scrollTo(0, (document.body.scrollHeight / 4) * n), s);
                await page.waitForTimeout(400);
              }

              // 3a) tenta interceptar responses JSON
              for (const body of respJSON) {
                const lista = extrairLista(body);
                if (Array.isArray(lista) && lista.length && detectarImovel(lista[0])) {
                  items = lista.slice(0, 500).map(r => normalizar(r, fonte));
                  break;
                }
              }

              // 3b) fallback DOM - cards com href de imovel/lote
              if (!items.length) {
                items = await page.$$eval(
                  "a[href*='/imovel'], a[href*='/lote'], a[href*='/leilao/'], a[href*='/imoveis/'], a[href*='/veiculos/'], a[href*='/ficha/'], a[href*='/detalhe'], a[href*='/bem/'], .card a[href], .card-imovel a, .item-imovel a, .card-lote a, [data-imovel-id] a, [data-lote-id] a, article a, .lote a, .bem-card a",
                  (els) => {
                    const out = [];
                    const vistos = new Set();
                    for (const el of els.slice(0, 800)) {
                      const href = el.getAttribute("href") || "";
                      if (!href || href === "#" || href.startsWith("javascript:")) continue;
                      if (vistos.has(href)) continue;
                      vistos.add(href);
                      const bloco = el.closest("article, .card, .card-imovel, .card-lote, li, .item") || el.parentElement || el;
                      const texto = (bloco.textContent || "").trim().replace(/\s+/g, " ");
                      if (texto.length < 20) continue;
                      if (!/leil|lote|imov|ve[ií]cul|apart|casa|terreno|arremat|edital/i.test(texto)) continue;
                      // card-title / card-locality / card-price (megaleiloes) nao casavam
                      // com .title/.local/.price: o titulo caia no fallback texto.slice(0,100)
                      // ("30%abaixo na2a praca R$ 28.509,60 2775 0 Carro Hyundai...") e
                      // cidade/uf/preco vinham vazios.
                      const titulo = (bloco.querySelector("h1,h2,h3,h4,.titulo,.nome,.title,[class*='card-title'],[class*='lote-titulo'],strong")?.textContent || "").trim() || texto.slice(0, 100);
                      const cidadeUf = (bloco.querySelector(".cidade,.local,.municipio,.city,.endereco,address,[class*='locality']")?.textContent || "").trim();
                      const preco = (bloco.querySelector(".preco,.valor,.lance,.lance-minimo,.price,[class*=valor],[class*=preco],[class*=price],[class*=lance]")?.textContent || "").trim();
                      const m = cidadeUf.match(/([A-ZÇÀÁÂÃÉÊÍÓÔÕÚÜ][a-zçàáâãéêíóôõúü\s]+)\s*[-–\/,]\s*([A-Z]{2})/);
                      // foto (background-image/data-bg/img), 1a e 2a praca, segundo lance
                      // e ano/marca/modelo. Sem o helper (init script bloqueado), segue
                      // mandando os campos antigos em vez de quebrar a extracao.
                      const extras = window.__lai ? window.__lai.extras(bloco, location.href, titulo, href, el) : {};
                      out.push({
                        id: href.replace(/\W+/g, "-").slice(-40),
                        titulo: titulo.slice(0, 200),
                        cidade: m?.[1]?.trim() || null,
                        uf: m?.[2] || null,
                        // numero, nao texto: numOuNull do worker devolve NaN->null
                        // para "R$ 28.509,60" (nao remove o separador de milhar)
                        lance_minimo: window.__lai ? window.__lai.preco(preco) : preco,
                        url: href,
                        ...extras,
                      });
                      if (out.length >= 400) break;
                    }
                    return out;
                  },
                );
              }

              // 3c) scroll extra mais agressivo se pouco items (lazy load)
              if (items.length < 10 && items.length > 0) {
                for (let s = 1; s <= 8; s++) {
                  await page.evaluate((n) => window.scrollTo(0, (document.body.scrollHeight / 8) * n), s);
                  await page.waitForTimeout(600);
                }
                // retenta DOM
                const extras = await page.$$eval(
                  "a[href*='/imovel'], a[href*='/lote'], a[href*='/leilao/'], a[href*='/imoveis/'], a[href*='/veiculos/'], a[href*='/ficha/'], a[href*='/bem/'], article a",
                  (els) => {
                    const out = [];
                    const vistos = new Set();
                    for (const el of els.slice(0, 800)) {
                      const href = el.getAttribute("href") || "";
                      if (!href || href === "#" || href.startsWith("javascript:")) continue;
                      if (vistos.has(href)) continue;
                      vistos.add(href);
                      const bloco = el.closest("article, .card, .card-imovel, .card-lote, li, .item") || el.parentElement || el;
                      const titulo = (el.textContent||"").trim().slice(0,200);
                      const extras = window.__lai ? window.__lai.extras(bloco, location.href, titulo, href, el) : {};
                      out.push({ id: href.replace(/\W+/g, "-").slice(-40), titulo, url: href, ...extras });
                      if (out.length >= 400) break;
                    }
                    return out;
                  },
                ).catch(() => []);
                const existentes = new Set(items.map(i => i.url));
                for (const e of extras) if (!existentes.has(e.url)) items.push(e);
              }

            } catch (e) {
              erro = (e && e.message || String(e)).slice(0, 200);
            } finally {
              await page.close().catch(()=>{});
            }

            // marca last_run_at no DB (independente do resultado)
            await marcarRun(fonte.id, items.length > 0, erro).catch(() => {});

            if (items.length) {
              // POST para /ingest
              try {
                const r = await fetch(`${AGG}/ingest`, {
                  method: "POST",
                  headers: { "x-disparo-secret": DISPARO, "content-type": "application/json" },
                  body: JSON.stringify({ source_id: fonte.id, items: items.slice(0, 500) }),
                });
                if (r.ok) {
                  const j = await r.json();
                  resumo.total_inseridos += (j.inseridos || 0);
                  resumo.ok++;
                  console.log(`[OK] ${label}: ${items.length} extraidos, ${j.inseridos} upserted`);
                } else {
                  resumo.erros++;
                  const txt = await r.text();
                  console.log(`[POST erro] ${label}: HTTP ${r.status} - ${txt.slice(0, 100)}`);
                }
              } catch (e) {
                resumo.erros++;
                console.log(`[POST fail] ${label}: ${e.message}`);
              }
            } else if (erro) {
              resumo.erros++;
              console.log(`[ERR] ${label}: ${erro}`);
            } else {
              resumo.vazios++;
              console.log(`[0 items] ${label}`);
            }
          }

          await browser.close();

          console.log(`\n=== RESUMO ===`);
          console.log(JSON.stringify(resumo, null, 2));

          // helpers
          function extrairLista(body, prof = 0) {
            if (prof > 4) return null;
            if (Array.isArray(body) && body.length) return body;
            if (body && typeof body === "object") {
              for (const k of ["imoveis","lotes","items","results","data","propertyList","anuncios","listagem","hits","content"]) {
                if (Array.isArray(body[k]) && body[k].length) return body[k];
              }
              for (const v of Object.values(body)) {
                if (v && typeof v === "object") {
                  const r = extrairLista(v, prof+1);
                  if (r) return r;
                }
              }
            }
            return null;
          }
          function detectarImovel(x) {
            if (!x || typeof x !== "object") return false;
            const keys = Object.keys(x).join(",").toLowerCase();
            return /imov|lote|bem|auct|imov|address|endereco|city|cidade|uf|estado|preco|valor|lance/.test(keys);
          }
          function normalizar(raw, fonte) {
            const id = String(raw.id ?? raw.codigo ?? raw.numero ?? raw.idImovel ?? raw.slug ?? "").slice(0, 64);
            if (!id) return null;
            const urlRel = String(raw.url ?? raw.link ?? raw.permalink ?? `/imovel/${id}`);
            const host = new URL(fonte.base_url).host;
            const url = urlRel.startsWith("http") ? urlRel : `${fonte.base_url.replace(/\/$/, "")}${urlRel.startsWith("/") ? urlRel : `/${urlRel}`}`;
            return {
              id,
              titulo: (raw.titulo ?? raw.nome ?? raw.title ?? raw.descricao ?? `Item ${id}`).toString().slice(0, 250),
              descricao: (raw.descricao ?? raw.description ?? "").toString().slice(0, 500),
              uf: raw.uf ?? raw.estado ?? raw.state ?? null,
              cidade: raw.cidade ?? raw.municipio ?? raw.city ?? null,
              bairro: raw.bairro ?? raw.neighborhood ?? null,
              endereco: raw.endereco ?? raw.address ?? null,
              area_sqm: raw.area ?? raw.areaTotal ?? raw.area_sqm ?? null,
              lance_minimo: raw.lanceMinimo ?? raw.valorMinimo ?? raw.preco ?? raw.valor ?? raw.lance ?? null,
              avaliacao: raw.avaliacao ?? raw.valorAvaliacao ?? null,
              edital_pdf_url: raw.editalUrl ?? raw.urlEdital ?? null,
              // API interna tambem publica foto e praca: repassa em vez de descartar
              images: imagensDaAPI(raw, url),
              first_auction_at: raw.primeiraPraca ?? raw.dataPrimeiraPraca ?? raw.dataLeilao ?? raw.data_leilao ?? raw.startDate ?? null,
              second_auction_at: raw.segundaPraca ?? raw.dataSegundaPraca ?? raw.data_segunda_praca ?? null,
              second_bid: raw.lanceSegunda ?? raw.valorSegundaPraca ?? raw.segundoLance ?? null,
              year: raw.ano ?? raw.anoModelo ?? raw.year ?? null,
              brand: raw.marca ?? raw.brand ?? null,
              model: raw.modelo ?? raw.model ?? null,
              url,
              raw_payload: { host },
            };
          }
          /** Achata os varios formatos de foto que as APIs internas usam. */
          function imagensDaAPI(raw, base) {
            const bruto = raw.images ?? raw.imagens ?? raw.fotos ?? raw.photos ?? raw.foto ?? raw.imagem ?? raw.thumbnail ?? raw.thumb ?? null;
            if (!bruto) return null;
            const lista = (Array.isArray(bruto) ? bruto : [bruto])
              .map((x) => (typeof x === "string" ? x : x?.url ?? x?.src ?? x?.link ?? x?.path ?? null))
              .filter((x) => typeof x === "string" && x && !/^data:/i.test(x) && !/no-?image|placeholder|sem-?foto/i.test(x))
              .map((x) => { try { return new URL(x, base).toString(); } catch { return null; } })
              .filter(Boolean)
              .slice(0, 6);
            return lista.length ? lista : null;
          }
          async function marcarRun(id, ok, erro) {
            await fetch(`${SB_URL}/rest/v1/sources?id=eq.${id}`, {
              method: "PATCH",
              headers: {
                apikey: SR,
                authorization: `Bearer ${SR}`,
                "content-type": "application/json",
                prefer: "return=minimal",
              },
              body: JSON.stringify({
                last_run_at: new Date().toISOString(),
                last_run_ok: ok,
                last_error: erro,
              }),
            });
          }
          EOF
          cd /tmp/lei && node --experimental-vm-modules batch.mjs

      - name: Summary
        if: always()
        run: |
          echo "### LeilôAI - Leiloeiros Batch" >> $GITHUB_STEP_SUMMARY
          echo "- Data: $(TZ='America/Sao_Paulo' date '+%d/%m/%Y %H:%M BRT')" >> $GITHUB_STEP_SUMMARY
          echo "- Worker: \`${AGREGADORES_URL}\`" >> $GITHUB_STEP_SUMMARY
