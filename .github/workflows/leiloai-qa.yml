# LeiloAI - QA: smoke test publico diario.
#
# O job `db-lint` semanal saiu em 21/08/2026; o motivo esta no fim do arquivo.
# Nao pode causar custo, so hits HTTP em rotas publicas

name: "LeiloAI: QA"

on:
  schedule:
    # Smoke diario as 6h UTC (3h BRT, fora do pico)
    - cron: '0 6 * * *'

  workflow_dispatch:
    inputs:
      job:
        description: "Qual job rodar"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - smoke
          - render

jobs:
  smoke:
    if: >-
      github.event.schedule == '0 6 * * *' ||
      github.event.inputs.job == 'all' ||
      github.event.inputs.job == 'smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checa rotas publicas criticas
        run: |
          set -euo pipefail
          rotas=(
            "https://leiloai.com/"
            "https://leiloai.com/api/health"
            "https://leiloai.com/api/v1"
            "https://leiloai.com/planos"
            "https://leiloai.com/cobertura"
            "https://leiloai.com/ferramentas"
            "https://leiloai.com/guias"
            "https://leiloai.com/sitemap.xml"
            "https://leiloai.com/robots.txt"
          )
          falhas=0
          for u in "${rotas[@]}"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$u")
            echo "$code $u"
            if [ "$code" != "200" ]; then
              falhas=$((falhas+1))
            fi
          done
          if [ $falhas -gt 0 ]; then
            echo "::error::$falhas rotas retornaram status diferente de 200"
            exit 1
          fi


  # ==========================================================================
  # RENDERIZACAO, e nao so codigo de status.
  # ==========================================================================
  #
  # O job `smoke` acima confere 200 em nove rotas. Isso e cego para o modo de
  # falha que este projeto ja viveu duas vezes em 08/08/2026: imagem
  # construida sem o secret do BuildKit sobe com `/api/health` respondendo
  # 200, login morto e home sem itens. Codigo de status nao ve nada disso.
  #
  # Os cinco testes que veem (h1 visivel e nao vazio, cartoes de plano,
  # redirect de area logada, forma do JSON da API publica, content-type do
  # sitemap) existiam em `apps/web/e2e/smoke.spec.ts` e eram disparados por um
  # workflow que NUNCA executou uma vez. Ele foi removido em 21/08/2026, e
  # deixar os testes sem dono seria trocar cobertura inerte por cobertura
  # nenhuma, entao eles passam a rodar aqui, contra producao.
  #
  # Nao expoe fonte: os cinco alvos sao paginas publicas do produto.
  render:
    name: renderizacao
    if: >-
      github.event.schedule == '0 6 * * *' ||
      github.event.inputs.job == 'all' ||
      github.event.inputs.job == 'render'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout do repositorio privado (unico step com credencial)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: RenatoPassos1/leilao-watch
          ref: feat/landing
          # Chave de deploy SOMENTE LEITURA, presa a este repositorio.
          ssh-key: ${{ secrets.LEILOAI_CHECKOUT_KEY }}
          persist-credentials: false
          fetch-depth: 1

      - name: Credencial nao persistiu
        run: |
          set -uo pipefail
          falhas=0
          if git config --local --get-regexp 'http\..*\.extraheader' >/dev/null 2>&1; then
            echo "FAIL extraheader presente"; falhas=$((falhas+1))
          fi
          if git config --local --get core.sshCommand >/dev/null 2>&1; then
            echo "FAIL core.sshCommand persistiu"; falhas=$((falhas+1))
          fi
          [ "$falhas" -eq 0 ] && echo "CREDENTIAL_PERSISTED false" || exit 1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.1.0
        with:
          node-version: "22"

      - name: Instalar e rodar
        working-directory: apps/web
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          # chromium E webkit: o `playwright.config.ts` tem dois projetos, e o
          # `mobile` usa `devices["iPhone 13"]`, que roda em WebKit. Instalar
          # so o chromium fazia 5 dos 10 testes morrerem com
          # "Executable doesn't exist at .../webkit-2272/pw_run.sh".
          # Medido no run 32444805777, disparado de proposito para provar o job
          # antes de deixa-lo agendado.
          npx playwright install chromium webkit --with-deps
          # A saida do Playwright nomeia so rotas publicas do produto.
          npx playwright test --reporter=line

  # JOB REMOVIDO EM 21/08/2026.
  #
  # Ele se chamava `db-lint`, recebia a URL e a chave de service role do
  # projeto Supabase Cloud, e o unico passo dele era um `echo` dizendo
  # "verificacao automatica de RLS (placeholder, pipeline a evoluir)". Um job
  # com nome de verificacao de seguranca que nao verificava nada, verde em 20
  # de 20 execucoes, apontando para um projeto que nao existe mais.
  #
  # Nao ha substituto aqui de proposito: o banco vive na VPS e nao e
  # alcancavel deste repositorio publico sem expor credencial. Medi o estado
  # hoje para o buraco nao ficar invisivel: das 116 tabelas de `public`, 105
  # tem RLS e 11 nao; dessas 11, quatro sao legiveis por `anon` ou
  # `authenticated`, e tres foram aprovadas por decisao registrada no lado
  # privado, em `services/ingestion/qualidade/leitura-anonima.test.ts`.
