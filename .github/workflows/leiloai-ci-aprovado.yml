# LeilôAI. Publica, no repositorio PUBLICO, quais commits do privado tem CI verde.
#
# ============================================================================
# POR QUE ISTO EXISTE
# ============================================================================
#
# Medido em 20/08/2026: o `leilao-watch` esta no plano Free, e tanto
# `branches/*/protection` quanto `rulesets` respondem 403
# "Upgrade to GitHub Pro". Nao existe *required status check*, entao CI
# vermelho DETECTA a regressao e nao IMPEDE nada: um commit reprovado pode ser
# mergeado e chegar em producao.
#
# A plataforma nao deixa bloquear o merge. Deixa bloquear o DEPLOY. Para isso o
# `scripts/deploy.sh` da VPS precisa conseguir perguntar "o CI DESTE SHA esta
# verde?" antes de construir qualquer coisa.
#
# ============================================================================
# POR QUE UM REF, E POR QUE NESTE REPOSITORIO
# ============================================================================
#
# Medido na propria VPS: ela **nao tem `gh`** e nao guarda token nenhum. Entao
# quem consulta a API e este workflow, onde o token ja existe, e o veredito
# vira um PAR de refs:
#
#     refs/ci-aprovado/<sha>        ->  objeto T
#     refs/tags/ci-aprovado-<sha>   ->  objeto T   (o MESMO)
#
# Ate 21/08/2026 esse ref morava no repositorio PRIVADO e apontava para o
# proprio commit. Mudou de lugar porque escrever la obrigava a credencial de
# veredito a ter `Contents: write` no repositorio que ela julga, e essa era a
# UNICA das oito chamadas de API do CI que pedia escrita. De quebra, a VPS
# passou a ler o veredito **sem credencial nenhuma**, porque o repositorio e
# publico.
#
# O par existe porque a prova mudou junto. No privado o portao exigia que o
# objeto apontado fosse exatamente o SHA perguntado; aqui aquele commit NAO
# existe, entao o ref aponta para uma tag anotada local e a prova passou a ser
# o NOME do ref. So o nome afrouxaria: um teste do mesmo dia mostrou que "ref
# com o nome certo apontando para outro objeto" passava a ser aprovado, e ele
# existe justamente para nunca ser. O par restaura a checagem.
#
# O que o par defende e ERRO, nao atacante: quem tem escrita aqui cria as duas
# refs certinhas, do mesmo jeito que antes podia apontar o ref para o commit
# exato. Contra escrita indevida quem defende e a permissao do repositorio.
#
# O que sai daqui e um SHA de 40 hexadecimais. Nao ha nome de fonte, caminho
# nem conteudo: o ref diz "o commit X passou", e X ja e opaco.
#
# NUNCA APAGA REF. Aprovacao nao se retira, porque um commit que passou no CI
# passou no CI. Se algo estiver errado com ele, o caminho e um commit novo.
#
# ============================================================================
# O TOKEN NAO ALCANCA CODIGO VINDO DO REPO PRIVADO
# ============================================================================
#
# A coleta (as chamadas `gh api`) esta AQUI, em codigo fixo deste arquivo, com
# `GH_TOKEN` no ambiente. Quem decide o veredito e
# `scripts/avaliar-checks.mjs`, buscado do repositorio privado e executado num
# passo **sem `env:` nenhum**. O GitHub so injeta secret onde ele e
# referenciado, entao o codigo baixado nao tem o que ler.
#
# Isso DUPLICA seis linhas de coleta que tambem existem em
# `scripts/conferir-ci-do-commit.sh` (na funcao `tentar_api`), e a duplicacao e
# deliberada: unificar exigiria executar o script do repo privado com o token
# no ambiente, que e exatamente a propriedade que este arquivo preserva. Se for
# mexer numa, olhe a outra.
#
# E `gh api`, nunca `curl -H "Authorization: Bearer ..."`: o `gh` le o token do
# ambiente e ele nao entra no argv, onde apareceria no `ps` do runner. Este
# repositorio e PUBLICO, e nada aqui imprime valor de credencial.

name: "LeilôAI: CI verde vira ref de aprovacao"

on:
  schedule:
    # De 5 em 5 minutos. E a latencia entre o CI ficar verde e o deploy poder
    # acontecer, entao vale ser curta: o build em si ja leva 9 minutos.
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/leiloai-ci-aprovado.yml"

permissions:
  # `write` porque o ref de aprovacao passou a ser criado NESTE
  # repositorio em 21/08/2026, e nao mais no privado. O passo
  # "Criar o ref de aprovacao" explica o motivo inteiro.
  contents: write

concurrency:
  group: leiloai-ci-aprovado
  cancel-in-progress: false

jobs:
  aprovar:
    name: aprovar commits com CI verde (${{ matrix.branch }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # `feat/landing` e o que a VPS tem em pe. `main` nao chega em producao.
        branch: ["feat/landing"]

    steps:
      - name: Coletar o estado do CI do HEAD (codigo fixo, com token)
        id: coletar
        env:
          GH_TOKEN: ${{ secrets.LEILOAI_STATUS_PAT }}
          BRANCH: ${{ matrix.branch }}
        run: |
          set -euo pipefail
          REPO=RenatoPassos1/leilao-watch
          mkdir -p ci

          SHA=$(gh api "repos/$REPO/branches/$BRANCH" --jq .commit.sha)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "$BRANCH -> $SHA"

          # `/actions/runs` e nao `/commits/{sha}/check-runs`: a rota de checks
          # responde 403 com este PAT, que nao tem a permissao `Checks`.
          EXEC=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" \
                   --jq '.workflow_runs[] | "\(.id) \(.head_sha)"')

          GRUPOS=""
          while read -r id head; do
            [ -n "${id:-}" ] || continue
            # head_sha injetado e o da EXECUCAO, para o avaliador conferir a
            # resposta da API contra a pergunta em vez de confirmar a si mesma.
            JOBS=$(gh api "repos/$REPO/actions/runs/$id/jobs?per_page=100" \
                     --jq "[.jobs[] | {id, name, status, conclusion, head_sha: \"$head\"}]")
            [ -n "$JOBS" ] || continue
            if [ -z "$GRUPOS" ]; then GRUPOS="$JOBS"; else GRUPOS="$GRUPOS,$JOBS"; fi
          done <<< "$EXEC"

          STATUSES=$(gh api "repos/$REPO/commits/$SHA/status" --jq '.statuses' || echo '[]')
          [ -n "$STATUSES" ] || STATUSES='[]'

          printf '{"sha":"%s","grupos":[%s],"statuses":%s}' "$SHA" "$GRUPOS" "$STATUSES" > ci/estado.json
          echo "estado coletado: $(wc -c < ci/estado.json) bytes"

          # O avaliador vem do repositorio privado, no MESMO SHA que esta sendo
          # julgado: a regra e do commit, e nao do branch.
          gh api "repos/$REPO/contents/scripts/avaliar-checks.mjs?ref=$SHA" \
            -H "Accept: application/vnd.github.raw" > ci/avaliar-checks.mjs
          echo "avaliador: $(wc -c < ci/avaliar-checks.mjs) bytes"

      # SEM `env:` DE PROPOSITO: e aqui que roda codigo vindo do outro repo.
      - name: Decidir (codigo do repo privado, sem token no ambiente)
        id: decidir
        continue-on-error: true
        run: node ci/avaliar-checks.mjs < ci/estado.json

      # O ref de aprovacao mora NESTE repositorio desde 21/08/2026, e nao mais
      # no privado. Duas razoes medidas, nao preferencia de estilo:
      #
      # 1. Escrever no privado obrigava a credencial a ter `Contents: write`
      #    LA. Medi as oito chamadas de API que os workflows do LeiloAI fazem
      #    e esta era a UNICA que pedia escrita: as outras sete leem commit,
      #    branch, conteudo, status e runs. Uma credencial que julga um
      #    repositorio nao precisa poder escrever nele.
      #
      # 2. Do outro lado, a VPS lia o ref por `git ls-remote` no privado, e por
      #    isso o portao dependia da chave de deploy so para ler um veredito.
      #    Em repositorio publico ele le sem credencial nenhuma.
      #
      # O que o ref carrega e um SHA de 40 hexadecimais. Nao ha nome de fonte,
      # caminho nem conteudo: ele diz "o commit X passou", e X ja e opaco.
      #
      # Detalhe que nao e obvio: o SHA e do repositorio PRIVADO e o objeto NAO
      # existe aqui, entao o ref nao pode apontar para aquele commit. Ele
      # aponta para uma tag anotada criada aqui, e quem confere le o NOME do
      # ref, que e exatamente o que o portao da VPS ja fazia.
      - name: Criar o ref de aprovacao
        if: steps.decidir.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.coletar.outputs.sha }}
          AQUI: ${{ github.repository }}
          OBJETO_LOCAL: ${{ github.sha }}
        run: |
          set -euo pipefail
          REF="refs/ci-aprovado/$SHA"

          REF_TAG="refs/tags/ci-aprovado-$SHA"

          # A idempotencia confere as DUAS refs, e nao so a primeira.
          #
          # Um review de 21/08/2026 achou o caminho sem saida: se a segunda
          # escrita falhasse por motivo transiente (rate limit secundario,
          # timeout, 5xx) DEPOIS da primeira ter dado certo, o `set -e`
          # abortava com o par pela metade. E a versao anterior desta checagem
          # testava SO `refs/ci-aprovado/<sha>`, entao toda reexecucao
          # encontrava a primeira ref, dizia "ja aprovado antes" e saia com
          # `exit 0` sem nunca completar a que faltava.
          #
          # O commit ficava com deploy proibido para sempre, e o remedio que o
          # proprio portao sugere ("rode o workflow de novo") era exatamente o
          # que nao funcionava.
          JA_REF=$(gh api "repos/$AQUI/git/$REF" --jq .object.sha 2>/dev/null || true)
          JA_TAG=$(gh api "repos/$AQUI/git/$REF_TAG" --jq .object.sha 2>/dev/null || true)

          if [ -n "$JA_REF" ] && [ -n "$JA_TAG" ]; then
            if [ "$JA_REF" = "$JA_TAG" ]; then
              echo "ja aprovado antes, par completo: $REF"
              exit 0
            fi
            echo "::error::par de aprovacao DIVERGENTE para $SHA; nao reescrevo sozinho"
            exit 1
          fi

          # Completar o par pela metade REUSA o objeto que ja existe, em vez de
          # criar uma tag nova: duas tags para o mesmo commit fariam as refs
          # apontarem para objetos diferentes, e o portao recusa par
          # divergente. Ou seja, criar tag nova aqui trocaria um par
          # incompleto (que a reserva ainda salva) por um par divergente (que
          # nada salva).
          OBJ="${JA_REF:-$JA_TAG}"
          if [ -z "$OBJ" ]; then
            OBJ=$(gh api -X POST "repos/$AQUI/git/tags" \
                    -f tag="ci-aprovado-$SHA" \
                    -f message="CI verde no commit $SHA do repositorio privado" \
                    -f object="$OBJETO_LOCAL" \
                    -f type=commit --jq .sha)
          else
            echo "::notice::par estava pela metade; completando com o objeto existente"
          fi

          gh api -X POST "repos/$AQUI/git/refs" \
            -f ref="$REF" -f sha="$OBJ" --jq .ref || true

          # A MESMA aprovacao tambem vira ref de tag, apontando para o MESMO
          # objeto. Nao e redundancia: o portao exige as duas consistentes.
          #
          # No desenho antigo, com o ref no repositorio privado, ele apontava
          # para o proprio commit aprovado, e o portao conferia isso. Aquela
          # verificacao nao cabe aqui, porque o commit privado nao existe neste
          # repositorio. Sem substituto, um ref apontando para objeto qualquer
          # passaria, e um teste de 21/08/2026 provou exatamente isso.
          #
          # O que esta camada defende e ERRO, nao atacante: quem tem escrita
          # aqui pode criar as duas refs certinhas, do mesmo jeito que antes
          # podia apontar o ref para o commit exato. Contra escrita indevida
          # quem defende e a permissao, nunca o formato do ref.
          gh api -X POST "repos/$AQUI/git/refs" \
            -f ref="refs/tags/ci-aprovado-$SHA" -f sha="$OBJ" --jq .ref || true

          echo "aprovado: $REF (com ref de tag pareada)"

      - name: Dizer alto quando NAO aprovou
        if: steps.decidir.outcome != 'success'
        env:
          SHA: ${{ steps.coletar.outputs.sha }}
        run: |
          echo "::notice::CI do commit ${SHA:0:8} ainda nao esta verde: nenhum ref de aprovacao foi criado, e o deploy deste commit fica bloqueado. Isto e o comportamento correto, nao um defeito deste workflow."
