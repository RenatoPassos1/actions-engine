# LeiloAI - Backup Weekly: pg_dump completo do Postgres Supabase
# subido para Cloudflare R2 via wrangler (API token Cloudflare).
#
# Falha no upload ou no dump NAO derruba CI. Em caso de erro, abre issue com label "incident".
#
# Secrets necessarios:
#   LEILOAI_SUPABASE_DB_URL   - postgres://... (Pooler ou direct, com password)
#   LEILOAI_CF_TOKEN          - Cloudflare API token com permissao R2:Edit
#   LEILOAI_CF_ACCOUNT        - Cloudflare account ID
#   CF_R2_BUCKET              - nome do bucket R2 (default: leiloai-backups)

name: "LeiloAI: Backup Diario"

on:
  schedule:
    - cron: '0 4 * * *' # DIARIO 04h UTC (01h BRT). Era semanal ate 04/08/2026:
                        # o incidente da migracao mostrou que 7 dias de janela
                        # de perda e inaceitavel.
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: leiloai-backup-weekly
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Instala postgresql-client 17 (PGDG)
        run: |
          set -euo pipefail
          # O client padrao do Ubuntu e o 16 e ele RECUSA dumpar servidor 17
          # ("server version mismatch"). Supabase roda Postgres 17.6.
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          # O wrapper /usr/bin/pg_dump resolve pro 16 mesmo com o 17 instalado.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Roda pg_dump
        id: dump
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.LEILOAI_SUPABASE_DB_URL }}
        run: |
          set -e
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "LEILOAI_SUPABASE_DB_URL nao configurado."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "erro=secret ausente" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # pipefail e OBRIGATORIO: sem ele, "pg_dump | gzip" retorna o status do
          # gzip (sempre 0) e um dump que falhou virava .gz vazio de 20 bytes
          # reportado como sucesso. Foi o que aconteceu de 04/2026 a 08/2026:
          # todos os backups eram vazios e ninguem soube ate precisar restaurar.
          set -o pipefail
          NOW=$(date -u +%Y%m%d_%H%M%S)
          DEST="backup_${NOW}.sql.gz"
          if ! pg_dump --no-owner --no-acl "$SUPABASE_DB_URL" | gzip > "$DEST"; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "erro=pg_dump falhou (exit $?)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SZ=$(stat -c '%s' "$DEST")
          # Validacao 1: integridade do gzip.
          if ! gzip -t "$DEST"; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "erro=gzip corrompido" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Validacao 2: tamanho minimo. Um dump real deste banco passa de 1 MB;
          # qualquer coisa menor e dump vazio disfarcado.
          MINIMO=1048576
          if [ "$SZ" -lt "$MINIMO" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "erro=dump suspeito: $SZ bytes (minimo $MINIMO)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Validacao 3: o dump precisa conter as tabelas criticas.
          if ! zcat "$DEST" | grep -qE 'COPY (auth\.users|public\.users)'; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "erro=dump sem dados de usuarios" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Backup salvo: $DEST ($SZ bytes)"
          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "arquivo=$DEST" >> "$GITHUB_OUTPUT"
          echo "tamanho=$SZ" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload para R2 (API REST)
        id: upload
        if: steps.dump.outputs.ok == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.LEILOAI_CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.LEILOAI_CF_ACCOUNT }}
          CF_R2_BUCKET: ${{ secrets.CF_R2_BUCKET }}
          ARQUIVO: ${{ steps.dump.outputs.arquivo }}
        run: |
          set -uo pipefail
          BUCKET="${CF_R2_BUCKET:-leiloai-backups}"
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "erro=Cloudflare secrets ausentes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Trocado wrangler pela API REST do R2: o wrangler falhava com
          # "Not enough non-option arguments" e ainda exigia instalar Node+npm
          # a cada run. curl direto e mais simples e ja validado.
          BASE="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${BUCKET}/objects"
          HTTP=$(curl -sS -o /tmp/r2.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/gzip" \
            --data-binary "@${ARQUIVO}" \
            "${BASE}/postgres/${ARQUIVO}")
          cat /tmp/r2.json
          if [ "$HTTP" != "200" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "erro=upload R2 HTTP $HTTP" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Confirma que o objeto existe no bucket com o tamanho esperado.
          REMOTO=$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${BASE}?prefix=postgres/${ARQUIVO}" \
            | python3 -c "import sys,json;r=json.load(sys.stdin).get('result') or [];print(r[0]['size'] if r else 0)")
          echo "Tamanho no R2: ${REMOTO} bytes (local: ${{ steps.dump.outputs.tamanho }})"
          if [ "${REMOTO:-0}" -lt 1048576 ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "erro=objeto no R2 vazio ou ausente ($REMOTO bytes)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Abre issue se falhou
        if: steps.dump.outputs.ok != 'true' || steps.upload.outputs.ok != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const dia = new Date().toISOString().slice(0, 10);
            const dumpOk = '${{ steps.dump.outputs.ok }}' === 'true';
            const uploadOk = '${{ steps.upload.outputs.ok }}' === 'true';
            const erroDump = '${{ steps.dump.outputs.erro }}';
            const erroUpload = '${{ steps.upload.outputs.erro }}';
            const titulo = `[incident] backup-weekly falhou ${dia}`;
            const corpo = [
              `Backup semanal nao concluiu.`,
              ``,
              `- pg_dump: ${dumpOk ? 'OK' : 'FALHOU (' + erroDump + ')'}`,
              `- upload R2: ${uploadOk ? 'OK' : 'FALHOU (' + erroUpload + ')'}`,
              ``,
              `Detectado em: ${new Date().toISOString()}`,
              `Workflow: leiloai-backup-weekly`,
            ].join('\n');
            const { data: existentes } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'incident',
              state: 'open',
              per_page: 100,
            });
            if (existentes.find(i => i.title === titulo)) {
              console.log('Issue ja existe para hoje, ignorando.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: titulo,
              body: corpo,
              labels: ['incident', 'leiloai-monitor'],
            });

      # O job PRECISA ficar vermelho quando o backup nao existe. Antes ele
      # terminava verde (continue-on-error nos dois passos) e o backup vazio
      # passou 4 meses despercebido.
      - name: Falha o job se o backup nao foi concluido
        if: steps.dump.outputs.ok != 'true' || steps.upload.outputs.ok != 'true'
        run: |
          echo "::error::Backup NAO concluido. pg_dump=${{ steps.dump.outputs.ok }} (${{ steps.dump.outputs.erro }}) upload=${{ steps.upload.outputs.ok }} (${{ steps.upload.outputs.erro }})"
          exit 1

      - name: Resumo
        if: always()
        run: |
          {
            echo "## LeiloAI, Backup do Postgres"
            echo ""
            echo "- pg_dump: \`${{ steps.dump.outputs.ok }}\`"
            echo "- arquivo: \`${{ steps.dump.outputs.arquivo }}\`"
            echo "- tamanho: \`${{ steps.dump.outputs.tamanho }}\` bytes"
            echo "- upload R2: \`${{ steps.upload.outputs.ok }}\`"
            echo "- bucket: \`leiloai-backups/postgres/\`"
          } >> "$GITHUB_STEP_SUMMARY"
